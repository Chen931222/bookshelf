<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>書櫃</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141310'/%3E%3Crect x='8.5' y='5' width='15' height='22' rx='1.2' fill='%23F2ECE0'/%3E%3Crect x='8.5' y='5' width='3.4' height='22' fill='%23C08A4E'/%3E%3Cline x1='15' y1='9' x2='20.5' y2='9' stroke='%23141310' stroke-width='1.1'/%3E%3Cline x1='15' y1='12' x2='20.5' y2='12' stroke='%23141310' stroke-width='1.1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141310;
  --paper:#F2ECE0;
  --dim:rgba(242,236,224,.42);
  --faint:rgba(242,236,224,.16);
  --card-w:clamp(210px,18.6vw,358px);
  /* 深讀頁兩個強調色各有職務：金色是我加的裝置（頁碼、目錄、我的話），
     紅色只代表原書自己的標記（紅框標語、分節符號、進度）。取自書頁照片
     實測的 #98525D（色相 351°），暖光洗掉的飽和度補回來。 */
  --red:#BE5060;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--serif);
  -webkit-font-smoothing:antialiased}

.nav{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;justify-content:space-between;
  align-items:baseline;padding:clamp(20px,2.4vw,42px);mix-blend-mode:difference;pointer-events:none}
.nav>*{pointer-events:auto}
.nav__mark{font-size:clamp(17px,1.5vw,28px);font-weight:600;letter-spacing:.14em}
.nav__link{font-family:var(--mono);font-size:clamp(11px,.78vw,14px);letter-spacing:.16em;
  text-transform:uppercase;color:var(--paper);text-decoration:none;opacity:.65}
.nav__link:hover,.nav__link:focus-visible{opacity:1}

/* ---------- 首頁：橫向類別廊道 ---------- */
.gallery{position:fixed;inset:0;display:flex;align-items:center;
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  overscroll-behavior-x:contain;scrollbar-width:thin;
  scrollbar-color:rgba(242,236,224,.22) transparent}
.gallery::-webkit-scrollbar{height:3px}
.gallery::-webkit-scrollbar-thumb{background:rgba(242,236,224,.22)}
.gallery:focus-visible{outline:none}
.track{display:flex;align-items:center;list-style:none;
  gap:clamp(28px,5.52vw,106px);padding-inline:calc(50% - var(--card-w)/2)}
.cell{flex:none;min-width:0;scroll-snap-align:center;scroll-snap-stop:always}
.card{position:relative;display:block;text-decoration:none;color:inherit;
  width:var(--card-w);aspect-ratio:358/505;background:var(--c);
  filter:saturate(.6) brightness(.86);
  transition:filter .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1)}
.card:hover,.card:focus-visible{filter:none;transform:translateY(-10px)}
.card:focus-visible{outline:1px solid var(--paper);outline-offset:10px}
.card::before,.card::after{content:"";position:absolute;left:0;right:0;height:1px;
  background:rgba(242,236,224,.28)}
.card::before{top:13.5%}
.card::after{bottom:13.5%}
.card__name{position:absolute;top:15%;left:0;right:0;bottom:23%;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.card__name i{writing-mode:vertical-rl;text-orientation:upright;font-style:normal;
  font-size:clamp(26px,2.9vw,52px);font-weight:600;letter-spacing:.08em;line-height:1.12;color:var(--paper)}
.card__foot{position:absolute;left:0;right:0;bottom:4.4%;text-align:center;padding:0 8%}
.card__count{display:block;font-family:var(--mono);font-size:clamp(10px,.63vw,12px);letter-spacing:.18em;color:var(--paper)}
.card__rep{display:block;font-size:clamp(10.5px,.63vw,12px);line-height:1.6;color:rgba(242,236,224,.62);letter-spacing:.03em;margin-top:9px}
.card__reading{display:block;font-family:var(--mono);font-size:clamp(9px,.5vw,10px);letter-spacing:.12em;color:rgba(242,236,224,.5);margin-top:6px}
/* 深讀筆記不是一格書架，是文章。在一排實色橫幅裡改用金線描邊、不填滿，
   讓它一眼看得出是另一種東西。（必須排在 .card 之後才蓋得掉 background） */
.card--deep{background:#17140F;border:1px solid rgba(192,138,78,.5);filter:none}
.card--deep::before,.card--deep::after{background:rgba(192,138,78,.38)}
.card--deep .card__name i,.card--deep .card__count{color:#C08A4E}
.card--deep:hover,.card--deep:focus-visible{filter:none;border-color:#C08A4E}

.counter{position:fixed;left:50%;bottom:clamp(24px,2.6vw,46px);transform:translateX(-50%);
  z-index:40;display:flex;align-items:center;gap:9px;font-family:var(--mono);
  font-size:clamp(11px,.73vw,14px);letter-spacing:.1em;mix-blend-mode:difference;pointer-events:none}
.counter__win{height:1.35em;width:1.6em;overflow:hidden;position:relative}
.counter__strip{position:absolute;inset:0 0 auto 0;text-align:center;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.counter__strip span{display:block;height:1.35em;line-height:1.35em}
.counter__dash,.counter__tot{color:var(--dim)}
.hint{position:fixed;left:clamp(20px,2.4vw,42px);bottom:clamp(24px,2.6vw,46px);z-index:40;
  font-family:var(--mono);font-size:clamp(10px,.6vw,11px);letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);mix-blend-mode:difference;pointer-events:none}
.wipe{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}
/* 轉場進行中要把點擊全部擋下來，否則使用者在「關閉中」的那 2 秒點下去，
   會打到還沒關掉的書櫃，開出一本書並卡在首頁上 */
.wipe.is-busy{pointer-events:auto}

/* ---------- 類別頁：3D 封面廊道 ---------- */
.cat{position:fixed;inset:0;z-index:60;visibility:hidden;opacity:0;background:var(--ink)}
.cat.is-on{visibility:visible;opacity:1}
.cat__title{position:fixed;top:0;left:0;right:0;z-index:66;display:flex;justify-content:space-between;
  align-items:baseline;padding:clamp(20px,2.4vw,42px);pointer-events:none;mix-blend-mode:difference}
.cat__word{font-size:clamp(15px,1.4vw,26px);font-weight:600;letter-spacing:.2em;color:var(--paper)}
.cat__word--r{font-family:var(--mono);font-size:clamp(11px,.8vw,14px);letter-spacing:.22em;
  text-transform:uppercase;font-weight:400;color:var(--dim)}

.stage{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 47%;
  overflow:hidden;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;
  will-change:transform}
.obj{position:absolute;left:0;top:0;width:150px;height:216px;margin:-108px 0 0 -75px;
  transform-style:preserve-3d;cursor:pointer;transition:opacity .18s linear}
.cover{position:absolute;inset:0;background:var(--c);overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;
  justify-content:space-between;padding:14px 12px;backface-visibility:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover__t{writing-mode:vertical-rl;text-orientation:upright;font-weight:600;
  font-size:16px;line-height:1.15;letter-spacing:.06em;color:var(--paper);
  align-self:flex-end;max-height:78%;overflow:hidden}
.cover__a{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:rgba(242,236,224,.6);
  writing-mode:horizontal-tb}
.cover__dot{position:absolute;top:9px;left:9px;width:6px;height:6px;border-radius:50%;
  background:var(--accent)}
.obj.is-dim{pointer-events:none}
/* 讓「這本可以點」看得出來 */
.obj:hover .cover{outline:1px solid rgba(242,236,224,.55);outline-offset:6px}

.hud{position:fixed;left:50%;bottom:clamp(20px,2.6vw,40px);transform:translateX(-50%);z-index:66;
  display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:clamp(10px,.72vw,12px);
  letter-spacing:.14em;color:var(--dim);mix-blend-mode:difference;pointer-events:none}
.hud b{color:var(--paper);font-weight:400}

.cat__close,.cat__list-btn{position:fixed;z-index:70;border:1px solid var(--faint);
  background:var(--ink);color:var(--paper);font-family:var(--mono);letter-spacing:.1em;
  cursor:pointer;transition:border-color .35s}
.cat__close{top:clamp(18px,2.2vw,38px);right:clamp(20px,2.4vw,42px);
  width:clamp(60px,3.8vw,74px);aspect-ratio:1;border-radius:50%;font-size:clamp(10px,.66vw,12px)}
.cat__list-btn{bottom:clamp(20px,2.6vw,40px);right:clamp(20px,2.4vw,42px);
  padding:10px 16px;border-radius:var(--radius,8px);font-size:clamp(10px,.66vw,12px);
  text-transform:uppercase}
.cat__close:hover,.cat__list-btn:hover{border-color:var(--paper)}
.cat__close[hidden],.cat__list-btn[hidden]{display:none}

.home-btn{position:fixed;bottom:clamp(20px,2.6vw,40px);left:clamp(20px,2.4vw,42px);z-index:72;
  padding:10px 18px;border:1px solid var(--faint);border-radius:8px;background:var(--ink);
  color:var(--paper);font-family:var(--mono);font-size:clamp(10px,.66vw,12px);
  letter-spacing:.14em;cursor:pointer;transition:border-color .35s}
.home-btn:hover{border-color:var(--paper)}
.home-btn[hidden]{display:none}

/* 聚焦：封面旋轉 + 右側資訊 */
/* 底色要夠不透明，否則後面的書櫃與 HUD 會透出來壓在文字上 */
.focus{position:fixed;inset:0;z-index:68;visibility:hidden;opacity:0;
  background:rgba(14,13,11,.93);backdrop-filter:blur(26px) saturate(.6);
  -webkit-backdrop-filter:blur(26px) saturate(.6);
  display:grid;grid-template-columns:1fr minmax(320px,38%);
  transition:opacity .5s}
/* 詳情打開時，把類別層的抬頭與 HUD 收掉，避免文字互相疊字 */
.cat.is-focusing .cat__title,.cat.is-focusing .hud{opacity:0;transition:opacity .3s}
.focus.is-on{visibility:visible;opacity:1}
.focus__spinwrap{display:flex;align-items:center;justify-content:center;perspective:1400px}
/* 注意：filter 會讓 preserve-3d 退化成 flat（背面直接蓋住封面），
   所以這裡不能用 drop-shadow，改由各個面自己的 box-shadow 做立體感 */
.focus__spin{width:248px;height:357px;transform-style:preserve-3d;
  animation:spin 9s ease-in-out infinite}
.bk{position:absolute;top:50%;left:50%}
.bk-front{width:248px;height:357px;transform:translate(-50%,-50%) translateZ(11px)}
.bk-front .cover{position:absolute;inset:0;box-shadow:0 30px 60px rgba(0,0,0,.62)}
.bk-back{width:248px;height:357px;transform:translate(-50%,-50%) rotateY(180deg) translateZ(11px);
  box-shadow:inset 0 0 70px rgba(0,0,0,.45)}
.bk-spine{width:22px;height:357px;transform:translate(-50%,-50%) rotateY(-90deg) translateZ(124px);
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.bk-spine span{writing-mode:vertical-rl;text-orientation:upright;font-size:11px;font-weight:500;
  letter-spacing:.08em;color:var(--paper);opacity:.9;max-height:86%;overflow:hidden}
.bk-pages{width:22px;height:357px;transform:translate(-50%,-50%) rotateY(90deg) translateZ(124px);
  background:repeating-linear-gradient(90deg,#E9E1D1,#E9E1D1 1px,#d3caB8 1px,#d3caB8 2px)}
/* 擺動而非整圈旋轉：封面永遠朝著讀者，仍看得到書的厚度 */
@keyframes spin{
  0%{transform:rotateY(-26deg)}
  50%{transform:rotateY(24deg)}
  100%{transform:rotateY(-26deg)}
}
.panel{align-self:stretch;padding:clamp(70px,9vh,120px) clamp(28px,4vw,60px) clamp(40px,7vh,90px) 0;
  overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
  scrollbar-color:rgba(242,236,224,.2) transparent}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:rgba(242,236,224,.2)}
.panel__kicker{font-family:var(--mono);font-size:clamp(10px,.66vw,12px);letter-spacing:.24em;
  text-transform:uppercase;color:var(--accent)}
.panel__t{font-size:clamp(30px,3.6vw,54px);font-weight:600;line-height:1.08;margin-top:.3em}
.panel__a{font-size:clamp(14px,1vw,17px);color:var(--dim);margin-top:1em;letter-spacing:.04em}
.panel__meta{margin-top:2em;border-top:1px solid var(--faint);padding-top:1.4em;
  font-family:var(--mono);font-size:clamp(11px,.78vw,13px);line-height:2.1;color:var(--dim)}
.panel__meta b{color:var(--paper);font-weight:400;letter-spacing:.02em}
.panel__syn{margin-top:2em;font-size:clamp(13px,.95vw,16px);line-height:1.85;color:rgba(242,236,224,.78)}

/* 書籍詳情：大綱 / 觀點 / 各界評價 / 我的評語 */
.sec{margin-top:2.4em}
.sec__h{font-family:var(--mono);font-size:clamp(9.5px,.62vw,11px);letter-spacing:.26em;
  text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:.9em}
.sec__h::after{content:"";flex:1;height:1px;background:var(--faint)}
.sec__body{margin-top:1.1em;font-size:clamp(13px,.92vw,15.5px);line-height:1.9;
  color:rgba(242,236,224,.8)}
.pts{list-style:none;margin-top:1.1em}
.pts li{position:relative;padding-left:1.5em;margin-bottom:.75em;
  font-size:clamp(13px,.9vw,15px);line-height:1.8;color:rgba(242,236,224,.8)}
.pts li::before{content:"—";position:absolute;left:0;color:var(--accent);opacity:.7}
.rev{margin-top:1.1em}
.rev__i{padding:.85em 0;border-bottom:1px solid var(--faint)}
.rev__i:last-child{border-bottom:none}
.rev__s{font-family:var(--mono);font-size:clamp(9.5px,.6vw,11px);letter-spacing:.14em;
  color:var(--accent);opacity:.85}
.rev__t{margin-top:.4em;font-size:clamp(12.5px,.88vw,15px);line-height:1.8;
  color:rgba(242,236,224,.76)}
.mine{margin-top:1.1em;padding:1.1em 0 1.1em 1.3em;border-left:2px solid var(--accent);
  font-size:clamp(13.5px,.95vw,16px);line-height:1.85;color:rgba(242,236,224,.92)}
.mine__tag{display:block;font-family:var(--mono);font-size:clamp(9px,.58vw,10px);
  letter-spacing:.2em;color:var(--accent);margin-bottom:.6em;text-transform:uppercase}
.nores{margin-top:1.1em;font-size:clamp(12.5px,.88vw,14px);line-height:1.8;color:var(--dim)}

/* 我的筆記：心得 / 劃線句子 / 概念標籤 */
.note{color:rgba(242,236,224,.9)}
.quotes{list-style:none;margin-top:1.2em}
.quotes li{position:relative;padding-left:1.4em;margin-bottom:.9em;
  font-size:clamp(13px,.92vw,15.5px);line-height:1.85;color:rgba(242,236,224,.82);
  font-style:italic}
.quotes li::before{content:"";position:absolute;left:0;top:.45em;bottom:.45em;
  width:2px;background:var(--accent);opacity:.65}
.tags{margin-top:1.3em;display:flex;flex-wrap:wrap;gap:8px}
.tag{font-family:var(--mono);font-size:clamp(10px,.66vw,11.5px);letter-spacing:.1em;
  padding:.42em .85em;border:1px solid var(--faint);border-radius:2px;
  color:rgba(242,236,224,.72)}

/* ---------- 深讀筆記：獨立長頁，點了才載 ---------- */
.deep-link{display:inline-block;margin-top:1.6em;font-family:var(--mono);
  font-size:clamp(11px,.75vw,13px);letter-spacing:.14em;color:var(--accent);
  text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:2px;cursor:pointer}
.deep-link:hover{opacity:.72}

.deep{position:fixed;inset:0;z-index:78;background:var(--ink);overflow-y:auto;
  /* 欄寬要跟著內文字級走。先前欄寬寫死 600px、字級卻是 clamp，
     在 1280px 筆電上字級縮到 14.5px，一行就變成 41 字（目標 35）。 */
  --prose:clamp(14.5px,1.02vw,17px);
  visibility:hidden;opacity:0}
.deep.is-on{visibility:visible;opacity:1}
/* 深讀頁是長文，排版規則跟書櫃其他地方不一樣：
   欄寬鎖在 35 字上下（720px／17px 是一行 42 字，讀起來會開始跳行）、
   左邊留一條頁邊給目錄、節與節之間留大白。 */
.deep__inner{max-width:min(1180px,92vw);margin:0 auto;
  padding:clamp(44px,9vh,110px) 0 clamp(80px,14vh,160px)}

/* ── 門面：封面＋書名＋規格，讓這頁一眼看得出是一篇有身分的文章 ──
   桌機刻意跟內文共用同一套格線：封面退到左頁邊（跟目錄同一欄），
   書名切齊內文左緣。門面自己置中的話會多出一條起跑線，眼睛看得出來。 */
.deep__head{display:grid;grid-template-columns:clamp(88px,10vw,140px) minmax(0,1fr);
  gap:clamp(18px,2.8vw,44px);align-items:start;
  padding-bottom:clamp(26px,4vh,46px);border-bottom:1px solid var(--faint)}
@media (min-width:1080px){
  .deep__head{grid-template-columns:1fr min(600px,100%) 1fr;
    column-gap:clamp(24px,3vw,56px)}
  .deep__cover{grid-column:1;justify-self:end;width:min(150px,100%)}
  .deep__head>div:not(.deep__cover){grid-column:2}
}
.deep__cover{aspect-ratio:2/3;background:rgba(242,236,224,.05);overflow:hidden;
  box-shadow:0 16px 38px rgba(0,0,0,.5)}
.deep__cover img{width:100%;height:100%;object-fit:cover;display:block}
.deep__kicker{font-family:var(--mono);font-size:clamp(10px,.72vw,12px);letter-spacing:.24em;
  text-transform:uppercase;color:#C08A4E}
.deep__h{font-size:clamp(27px,4.2vw,52px);font-weight:600;line-height:1.1;margin-top:.28em}
.deep__by{margin-top:.85em;font-size:clamp(12.5px,.94vw,15.5px);color:rgba(242,236,224,.68)}
.deep__specs{display:flex;flex-wrap:wrap;gap:clamp(16px,2.2vw,38px);margin-top:clamp(16px,2.4vh,28px)}
.deep__specs dt{font-family:var(--mono);font-size:clamp(9px,.6vw,10.5px);letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim)}
.deep__specs dd{margin-top:.5em;font-family:var(--mono);font-size:clamp(11.5px,.86vw,13.5px);
  letter-spacing:.04em;color:rgba(242,236,224,.86)}
.deep__source{margin-top:1.5em;font-family:var(--mono);font-size:clamp(9.5px,.68vw,11.5px);
  letter-spacing:.05em;line-height:1.9;color:var(--dim)}

/* ── 目錄 ── */
.deep__body{display:grid;grid-template-columns:1fr min(calc(var(--prose) * 35),100%) 1fr;
  column-gap:clamp(24px,3vw,56px);margin-top:clamp(38px,6.5vh,78px)}
.deep__col{grid-column:2;min-width:0}
/* 目錄是拿來「找」的，左對齊給眼睛一條穩定的軸；區塊本身仍貼著版心那側 */
.deep__toc{grid-column:1;justify-self:end;width:min(212px,100%);text-align:left;
  position:sticky;top:clamp(36px,8vh,104px);align-self:start}
.deep__toc h4,.deep__tocm h4{font-family:var(--mono);font-size:10px;letter-spacing:.22em;
  text-transform:uppercase;color:#C08A4E;font-weight:400}
.deep__toc ol{list-style:none;margin-top:1.3em}
.deep__toc li+li{margin-top:.95em}
.deep__toc a{display:block;color:var(--dim);text-decoration:none;
  font-size:12.5px;line-height:1.5;transition:color .25s;
  text-wrap:pretty}   /* 目錄項會斷成末行只剩一個字，交給瀏覽器平衡 */
.deep__toc a:hover{color:rgba(242,236,224,.78)}
.deep__toc a.is-cur,.deep__tc.is-cur>a{color:#C08A4E}
.deep__toc .pg{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  opacity:.75;margin-bottom:.3em}
/* 只展開正在讀的那一章的小標，其餘收起來 */
.deep__tsub{list-style:none;margin-top:.6em;display:none}
.deep__tc.is-cur .deep__tsub{display:block}
.deep__tsub li{margin-top:.5em}
.deep__tsub a{font-size:11.5px;line-height:1.45;color:rgba(242,236,224,.34)}
.deep__tsub a:hover{color:rgba(242,236,224,.72)}
.deep__toc{max-height:calc(100vh - 150px);overflow-y:auto;scrollbar-width:none}
.deep__toc::-webkit-scrollbar{display:none}

/* ── 章 ── */
.deep__ch{margin-top:clamp(76px,13vh,170px)}
.deep__ch:first-child{margin-top:0}
/* 章扉：巨大的章號當底、章名壓在上面。中文沒有 drop cap 的傳統，這是等價物 */
.deep__chhead{position:relative;padding-top:clamp(26px,5vh,58px)}
.deep__chbig{position:absolute;left:-.08em;top:0;line-height:.78;
  font-size:clamp(96px,13vw,190px);font-weight:600;color:rgba(192,138,78,.11);
  pointer-events:none;user-select:none}
.deep__chn{position:relative;font-family:var(--mono);font-size:clamp(10px,.68vw,11.5px);
  letter-spacing:.2em;color:#C08A4E}
.deep__cht{position:relative;margin-top:.45em;font-size:clamp(23px,3vw,38px);font-weight:600;
  line-height:1.22;padding-bottom:.5em;border-bottom:1px solid rgba(192,138,78,.42)}
/* 章題詞：原書紅框標語升級成大字引文，一章只有一句 */
.deep__epi{margin-top:clamp(24px,4vh,44px);padding:clamp(18px,2.6vh,30px) clamp(18px,2.4vw,30px);
  border:1px solid rgba(190,80,96,.5)}
.deep__epi p{font-size:clamp(18px,1.62vw,27px);line-height:1.72;font-weight:500;
  color:rgba(242,236,224,.96);text-indent:0}
.deep__epi cite{display:block;margin-top:.9em;font-family:var(--mono);font-style:normal;
  font-size:clamp(9.5px,.64vw,11px);letter-spacing:.12em;color:var(--red)}
/* 書上用三顆紅星號分節，網頁照搬——比一條細線更像那本書 */
.deep__star{margin:clamp(34px,5.5vh,64px) 0 clamp(26px,4vh,44px);text-align:center;
  font-size:clamp(11px,.8vw,13px);letter-spacing:1.1em;text-indent:1.1em;color:var(--red);opacity:.72}
.deep__g{margin-top:clamp(46px,7.5vh,92px)}
.deep__ch>.deep__g:first-of-type{margin-top:clamp(28px,4.6vh,52px)}
/* 沒拍到的段落畫一條斷線說清楚，免得讀起來像連續的 */
/* 頂部閱讀進度條。兩小時的長文，讀者要看得到自己在哪 */
.deep__prog{position:fixed;left:0;right:0;top:0;z-index:81;height:2px;background:rgba(242,236,224,.07)}
.deep__prog i{display:block;height:100%;background:var(--red);
  transform:scaleX(0);transform-origin:0 50%;will-change:transform}
/* 桌機有側邊固定目錄就不需要這兩個；反過來也是 */
.deep__tocm{display:none;margin-top:clamp(26px,4vh,42px);padding:1.1em 0;
  border-top:1px solid var(--faint);border-bottom:1px solid var(--faint)}
.deep__tocm summary{list-style:none;cursor:pointer;font-family:var(--mono);font-size:10px;
  letter-spacing:.22em;text-transform:uppercase;color:#C08A4E}
.deep__tocm summary::-webkit-details-marker{display:none}
.deep__tocm summary::after{content:" ▾";letter-spacing:0}
.deep__tocm[open] summary::after{content:" ▴"}
.deep__tocm ol{list-style:none;margin-top:1.1em}
.deep__tocm li+li{margin-top:.8em}
.deep__tocm a{display:flex;gap:1em;align-items:baseline;text-decoration:none;
  color:rgba(242,236,224,.78);font-size:14px;line-height:1.5}
.deep__tocm a.is-cur{color:#C08A4E}
.deep__tocm .pg{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--dim);
  flex:none;min-width:5.2em}
@media (max-width:1079px){
  .deep__toc{display:none}
  .deep__tocm{display:block}
  .deep__body{grid-template-columns:minmax(0,1fr)}
  .deep__col{grid-column:1}
}
.deep__top{position:fixed;right:clamp(14px,3vw,26px);bottom:clamp(14px,3vw,26px);z-index:79;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--faint);
  background:rgba(20,19,16,.88);backdrop-filter:blur(6px);
  color:rgba(242,236,224,.7);font-family:var(--mono);font-size:15px;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .3s}
.deep__top.is-on{opacity:1;pointer-events:auto}
/* 手機讀到一半要換章，本來得整段捲回頁首。這顆鈕就地叫出章節表，
   位置不會跑掉；桌機有側邊固定目錄，不需要。 */
.deep__nav{position:fixed;right:clamp(14px,3vw,26px);z-index:79;
  bottom:calc(clamp(14px,3vw,26px) + 54px);
  height:44px;padding:0 17px;border-radius:22px;border:1px solid var(--faint);
  background:rgba(20,19,16,.9);backdrop-filter:blur(6px);color:rgba(242,236,224,.8);
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .3s}
.deep__nav.is-on{opacity:1;pointer-events:auto}
.deep__sheet{position:fixed;inset:0;z-index:82;background:rgba(14,13,11,.975);
  overflow-y:auto;overscroll-behavior:contain;
  visibility:hidden;opacity:0;transition:opacity .22s}
.deep__sheet.is-on{visibility:visible;opacity:1}
.deep__sheet__in{max-width:min(560px,90vw);margin:0 auto;padding:clamp(22px,4.5vh,44px) 0 60px}
.deep__sheet__hd{display:flex;justify-content:space-between;align-items:baseline;gap:1em;
  padding-bottom:1em;border-bottom:1px solid var(--faint);
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:#C08A4E}
.deep__sheet__x{background:none;border:0;padding:0;color:var(--dim);font-family:var(--mono);
  font-size:11px;letter-spacing:.16em;cursor:pointer}
.deep__sheet ol{list-style:none;margin-top:1.5em}
.deep__sheet li+li{margin-top:.95em}
.deep__sheet a{display:flex;gap:1em;align-items:baseline;text-decoration:none;
  color:rgba(242,236,224,.78);font-size:15px;line-height:1.5}
.deep__sheet a.is-cur{color:#C08A4E}
.deep__sheet .pg{flex:none;min-width:5.6em;font-family:var(--mono);font-size:10.5px;color:var(--dim)}
@media (min-width:1080px){.deep__top,.deep__nav,.deep__sheet{display:none}}

/* ── 深讀索引：首頁那張金色橫幅點進來的地方，壓在深讀內文底下一層 ── */
.dx{position:fixed;inset:0;z-index:77;background:var(--ink);overflow-y:auto;
  visibility:hidden;opacity:0}
.dx.is-on{visibility:visible;opacity:1}
.dx__inner{max-width:min(880px,90vw);margin:0 auto;
  padding:clamp(56px,12vh,140px) 0 clamp(80px,14vh,160px)}
.dx__kicker{font-family:var(--mono);font-size:clamp(10px,.72vw,12px);letter-spacing:.24em;
  text-transform:uppercase;color:#C08A4E}
.dx__h{font-size:clamp(34px,5.2vw,62px);font-weight:600;line-height:1.08;margin-top:.24em}
.dx__sub{max-width:34em;margin-top:1.2em;font-size:clamp(13.5px,.98vw,16px);line-height:1.95;
  color:rgba(242,236,224,.7)}
.dx__list{list-style:none;margin-top:clamp(34px,6vh,66px);border-top:1px solid var(--faint)}
.dx__item{display:grid;grid-template-columns:clamp(62px,7vw,98px) minmax(0,1fr);
  gap:clamp(16px,2.4vw,34px);align-items:start;text-decoration:none;color:inherit;
  padding:clamp(22px,3.6vh,38px) 0;border-bottom:1px solid var(--faint);
  transition:opacity .3s}
.dx__item:hover,.dx__item:focus-visible{opacity:.72;outline:none}
.dx__cover{aspect-ratio:2/3;overflow:hidden;background:rgba(242,236,224,.05);
  box-shadow:0 10px 26px rgba(0,0,0,.45)}
.dx__cover img{width:100%;height:100%;object-fit:cover;display:block}
.dx__t{font-size:clamp(19px,2.1vw,29px);font-weight:600;line-height:1.28}
.dx__a{margin-top:.55em;font-size:clamp(12px,.9vw,14.5px);color:rgba(242,236,224,.6)}
.dx__specs{display:flex;flex-wrap:wrap;gap:clamp(12px,1.8vw,26px);margin-top:1.1em;
  font-family:var(--mono);font-size:clamp(10px,.72vw,12px);letter-spacing:.08em;color:var(--dim)}
.dx__go{margin-top:1.15em;font-family:var(--mono);font-size:clamp(10px,.7vw,11.5px);
  letter-spacing:.2em;text-transform:uppercase;color:#C08A4E}
.dx__foot{max-width:32em;margin-top:clamp(28px,4.5vh,50px);font-size:clamp(12px,.86vw,13.5px);
  line-height:1.95;color:var(--dim)}

/* ── 內文 ── */
/* 每群自己的頁碼錨點，兼作視覺呼吸點。引文可能被去重掉，這行保證每群都指得出出處。 */
.deep__pages{display:flex;align-items:center;gap:.85em;margin-bottom:.95em;
  font-family:var(--mono);font-size:clamp(10px,.68vw,11.5px);letter-spacing:.14em;color:#C08A4E}
.deep__pages::before{content:"";flex:none;width:clamp(18px,2vw,30px);height:1px;
  background:#C08A4E;opacity:.5}
.deep__sh{font-size:clamp(19px,1.9vw,26px);font-weight:600;line-height:1.4;
  padding-bottom:.5em;border-bottom:1px solid var(--faint)}
/* 段首空兩格、段距收窄——像書，不像網頁。行高 1.95 是中文長文的甜蜜點 */
.deep__p{margin-top:.55em;text-indent:2em;font-size:var(--prose);line-height:1.95;
  color:rgba(242,236,224,.86)}
.deep__sh+.deep__p,.deep__pages+.deep__p{margin-top:1.2em}
.deep__q{margin:1.9em 0;padding-left:1.4em;border-left:2px solid #C08A4E}
/* 原書紅框裡的句子：用書自己的紅細框，跟一般引文分層 */
.deep__q--box{padding:clamp(14px,1.8vh,20px) clamp(15px,1.8vw,22px);
  border:1px solid rgba(190,80,96,.45);border-left-width:1px}
.deep__q--box p{font-style:normal;font-weight:500}
.deep__q--box cite{color:var(--red)}
.deep__q p{font-size:clamp(15px,1.08vw,18px);line-height:1.9;font-style:italic;
  color:rgba(242,236,224,.94);text-indent:0}
.deep__q cite{display:block;margin-top:.7em;font-family:var(--mono);font-style:normal;
  font-size:clamp(10px,.66vw,11.5px);letter-spacing:.12em;color:var(--dim)}
.deep__mine{margin-top:clamp(48px,8vh,84px);border-top:1px solid var(--faint);padding-top:2em}
.deep__mine h3{font-family:var(--mono);font-size:clamp(10px,.72vw,12px);letter-spacing:.22em;
  text-transform:uppercase;color:#C08A4E;font-weight:400}
.deep__mine .body{margin-top:1.2em;font-size:var(--prose);line-height:1.95;
  color:rgba(242,236,224,.88)}
.deep__mine .empty{margin-top:1.2em;font-size:clamp(13px,.9vw,15px);line-height:1.9;color:var(--dim)}
.deep__foot{margin-top:clamp(40px,6vh,70px);font-family:var(--mono);
  font-size:clamp(9.5px,.64vw,11px);line-height:2;color:rgba(242,236,224,.3)}

/* ---------- 問書櫃 ---------- */
.ask{position:fixed;inset:0;z-index:74;background:var(--ink);overflow-y:auto;
  visibility:hidden;opacity:0}
.ask.is-on{visibility:visible;opacity:1}
.ask__inner{max-width:min(760px,90vw);margin:0 auto;
  padding:clamp(48px,10vh,130px) 0 clamp(60px,10vh,120px)}
.ask__kicker{font-family:var(--mono);font-size:clamp(10px,.72vw,12px);letter-spacing:.24em;
  text-transform:uppercase;color:#C08A4E}
.ask__h{font-size:clamp(38px,6.5vw,76px);font-weight:600;line-height:1.02;margin-top:.22em}
.ask__sub{margin-top:1.1em;font-size:clamp(13px,.95vw,16px);line-height:1.85;
  color:rgba(242,236,224,.7)}
.ask__form{margin-top:clamp(26px,4vh,44px);display:flex;gap:10px;flex-wrap:wrap}
.ask__in{flex:1 1 320px;min-width:0;background:transparent;color:var(--paper);
  border:1px solid var(--faint);border-radius:2px;padding:.95em 1.1em;
  font-family:var(--serif);font-size:clamp(14px,1vw,16.5px);line-height:1.5}
.ask__in::placeholder{color:rgba(242,236,224,.34)}
.ask__in:focus{outline:none;border-color:rgba(242,236,224,.45)}
.ask__go{flex:0 0 auto;background:transparent;color:var(--paper);cursor:pointer;
  border:1px solid rgba(242,236,224,.4);border-radius:2px;padding:0 1.6em;
  font-family:var(--mono);font-size:clamp(11px,.75vw,13px);letter-spacing:.16em;
  transition:border-color .3s,opacity .3s}
.ask__go:hover:not(:disabled){border-color:var(--paper)}
.ask__go:disabled{opacity:.4;cursor:default}
.ask__eg{margin-top:1.2em;display:flex;flex-wrap:wrap;gap:8px}
.ask__eg button{background:none;border:1px solid var(--faint);border-radius:2px;
  color:rgba(242,236,224,.6);font-family:var(--serif);font-size:clamp(11.5px,.78vw,13px);
  padding:.5em .9em;cursor:pointer;transition:color .3s,border-color .3s}
.ask__eg button:hover{color:var(--paper);border-color:rgba(242,236,224,.4)}
.ask__out{margin-top:clamp(28px,4.5vh,48px);font-size:clamp(14px,1vw,16.5px);
  line-height:1.95;color:rgba(242,236,224,.88);white-space:pre-wrap;min-height:1em}
.ask__out:empty{display:none}
.ask__note{margin-top:2em;font-family:var(--mono);font-size:clamp(10px,.66vw,11.5px);
  line-height:1.9;color:rgba(242,236,224,.3)}
.ask__cursor{display:inline-block;width:.5em;height:1em;background:#C08A4E;
  vertical-align:-.12em;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.srcs{margin-top:1.4em;font-family:var(--mono);font-size:clamp(9px,.58vw,10.5px);
  letter-spacing:.06em;color:rgba(242,236,224,.3);line-height:1.9;word-break:break-all}
.focus__close{position:fixed;top:clamp(18px,2.2vw,38px);right:clamp(20px,2.4vw,42px);z-index:69;
  width:clamp(60px,3.8vw,74px);aspect-ratio:1;border-radius:50%;border:1px solid var(--faint);
  background:none;color:var(--paper);font-family:var(--mono);font-size:clamp(10px,.66vw,12px);
  letter-spacing:.1em;cursor:pointer;transition:border-color .35s}
.focus__close:hover{border-color:var(--paper)}

/* 清單檢視（可及性 / reduced-motion 後備） */
.listview{position:fixed;inset:0;z-index:64;background:var(--ink);overflow-y:auto;
  visibility:hidden;opacity:0}
.listview.is-on{visibility:visible;opacity:1}
.listview__inner{max-width:min(1100px,92vw);margin:0 auto;padding:clamp(40px,7vh,110px) 0 120px}
.lv__name{font-size:clamp(48px,9vw,120px);font-weight:600;line-height:.94;letter-spacing:.02em}
.lv__meta{margin-top:1.4em;font-family:var(--mono);font-size:clamp(11px,.85vw,14px);color:var(--dim);line-height:1.9}
.lv__list{list-style:none;margin-top:clamp(30px,5vh,56px)}
.row{display:flex;align-items:baseline;gap:16px;padding:13px 0;border-bottom:1px solid var(--faint)}
.row__i{flex:none;width:2.6em;font-family:var(--mono);font-size:clamp(10px,.7vw,12px);color:var(--dim)}
.row__t{flex:1 1 auto;min-width:0;font-size:clamp(16px,1.3vw,21px);line-height:1.35;font-weight:500}
.row__a{flex:none;font-family:var(--mono);font-size:clamp(10px,.72vw,12px);color:var(--dim);text-align:right;max-width:36%}
.row.is-reading .row__t::after{content:"　正在讀";font-family:var(--mono);font-size:.62em;letter-spacing:.14em;color:var(--accent);vertical-align:.15em}
.row.is-review{opacity:.6}
.row.is-review .row__t::before{content:"⌇ ";color:var(--accent)}

/* 留言 / 推薦 */
.book-nav{position:fixed;top:0;right:0;z-index:41;display:flex;gap:clamp(14px,1.6vw,26px);
  align-items:baseline;padding:clamp(20px,2.4vw,42px);pointer-events:none;mix-blend-mode:difference}
.book-nav a{pointer-events:auto;font-family:var(--mono);font-size:clamp(11px,.78vw,14px);
  letter-spacing:.16em;text-transform:uppercase;color:var(--paper);text-decoration:none;opacity:.65}
.book-nav a:hover,.book-nav a:focus-visible{opacity:1}
.guest{position:fixed;inset:0;z-index:64;background:var(--ink);overflow-y:auto;visibility:hidden;opacity:0}
.guest.is-on{visibility:visible;opacity:1}
.guest__inner{max-width:min(760px,90vw);margin:0 auto;padding:clamp(48px,10vh,140px) 0 120px}
.guest__kicker{font-family:var(--mono);font-size:clamp(10px,.72vw,12px);letter-spacing:.24em;
  text-transform:uppercase;color:var(--dim)}
.guest__h{font-size:clamp(40px,7vw,84px);font-weight:600;line-height:1;margin-top:.2em}
.guest__sub{margin-top:1.2em;font-size:clamp(13px,.95vw,16px);line-height:1.8;color:rgba(242,236,224,.7)}
.guest__wait{margin-top:2.4em;padding:1.4em 1.6em;border:1px solid var(--faint);border-radius:12px;
  font-family:var(--mono);font-size:clamp(11px,.8vw,13px);line-height:1.9;color:var(--dim)}
#waline{margin-top:clamp(30px,5vh,56px)}
/* Waline 深色編輯風覆寫 */
#waline{
  --waline-theme-color:#C08A4E;--waline-active-color:#E0A968;
  --waline-font-size:15px;--waline-white:#F2ECE0;--waline-dark-grey:#8b857a;
  --waline-color:#F2ECE0;--waline-bgcolor:transparent;--waline-bgcolor-light:rgba(242,236,224,.04);
  --waline-bgcolor-hover:rgba(242,236,224,.08);--waline-border-color:rgba(242,236,224,.16);
  --waline-disable-bgcolor:rgba(242,236,224,.06);--waline-disable-color:#6b665d;
  --waline-bq-color:rgba(242,236,224,.2);--waline-info-bgcolor:rgba(242,236,224,.03);
  --waline-info-color:#8b857a;--waline-border:1px solid rgba(242,236,224,.16);
  font-family:var(--serif)}
#waline .wl-editor,#waline .wl-input{color:var(--paper)}
#waline .wl-btn{border-color:rgba(242,236,224,.24)}

@media (max-width:767px){
  :root{--card-w:62vw}
  .track{gap:10vw}
  /* 手機：整片改成一般流動捲動，書在上、資訊在下，避免內容被裁掉 */
  .focus{display:block;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .focus__spinwrap{display:flex;align-items:center;justify-content:center;
    height:auto;padding:14vh 0 6vh}
  .panel{display:block;overflow:visible;padding:0 22px 110px}
  .panel__meta{border-top:none;padding-top:.6em}
}
@media (prefers-reduced-motion:reduce){
  .card,.counter__strip{transition:none}
  .focus__spin{animation:none}
}
</style>
</head>
<body>

<nav class="nav" id="homeNav">
  <span class="nav__mark">書櫃</span>
</nav>
<div class="book-nav" id="bookNav">
  <a href="#問書櫃" id="askLink">問書櫃</a>
  <a href="#留言" id="guestLink">留言</a>
  <a href="#其他" id="miscLink">其他</a>
</div>

<div class="gallery" id="gallery" tabindex="0" role="region" aria-label="書櫃分類，可橫向捲動">
  <ul class="track" id="track"></ul>
</div>

<div class="counter" aria-hidden="true">
  <span class="counter__win"><span class="counter__strip" id="strip"></span></span>
  <span class="counter__dash">—</span><span class="counter__tot" id="total"></span>
</div>
<p class="hint">滾動 · 點卡片進去</p>
<canvas class="wipe" id="wipe"></canvas>

<!-- 類別頁：3D 廊道 -->
<section class="cat" id="cat" aria-modal="true" role="dialog">
  <div class="cat__title" id="catTitle"></div>
  <div class="stage" id="stage" tabindex="0"><div class="world" id="world"></div></div>
  <div class="hud" id="hud"></div>
</section>

<section class="dx" id="dx" aria-label="深讀筆記"><div class="dx__inner" id="dxInner"></div></section>
<!-- z79：要壓過索引層（77）才看得到，又要讓深讀內文的 Close（80）在它之上 -->
<button class="cat__close" id="dxClose" hidden style="z-index:79">Close</button>

<script>
/* 書單資料在 books.json —— 加書、改筆記都只要編輯那個檔，不用動這裡 */
(async () => {
const DATA = await fetch('books.json', {cache:'no-cache'}).then(r => {
  if(!r.ok) throw new Error('books.json ' + r.status);
  return r.json();
});
const CATS = DATA.categories;

/* t=書名 a=作者 c=類別 ly=層 o=擺法 r=正在讀 rv=待核對 cover=封面檔(暫無) */
const BOOKS = DATA.books;

const RESEARCH = {}; BOOKS.forEach((b,i)=>{ if(b.res) RESEARCH[i]=b.res; });
BOOKS.forEach((b,i)=>{if(RESEARCH[i])b.res=RESEARCH[i];});

const byCat = k => BOOKS.filter(b => b.c === k);
const $ = id => document.getElementById(id);
const rm   = matchMedia("(prefers-reduced-motion: reduce)");
const fine = matchMedia("(hover: hover) and (pointer: fine)");
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const tint = hex => { const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255,f=.55;
  r=Math.round(r+(255-r)*f);g=Math.round(g+(255-g)*f);b=Math.round(b+(255-b)*f);return `rgb(${r},${g},${b})`; };
const shade = (hex,f) => { const n=parseInt(hex.slice(1),16);
  return `rgb(${Math.round((n>>16&255)*f)},${Math.round((n>>8&255)*f)},${Math.round((n&255)*f)})`; };
const clean = t => String(t).replace(/（.*?）/g,'');
const lyLabel = ly => ly===0 ? "手邊（正在讀）" : ["","第一層","第二層","第三層","第四層"][ly] || "—";
const oriLabel = o => ({spine:"書背朝外",face:"封面朝外",flat:"平放"})[o] || o;

/* ---------- 首頁 ---------- */
const gallery=$("gallery"), track=$("track"), strip=$("strip"), wipe=$("wipe");
const HOMECATS = CATS.filter(c=>!c.hidden);
HOMECATS.forEach((c,i)=>{
  const books=byCat(c.key), reading=books.filter(b=>b.r).length;
  const li=document.createElement("li"); li.className="cell";
  li.innerHTML='<a class="card" href="#'+c.key+'" style="--c:'+c.color+'" data-key="'+c.key+'">'
    +'<span class="card__name"><i>'+c.name+'</i></span><span class="card__foot">'
    +'<span class="card__count">'+books.length+' 冊</span>'
    +'<span class="card__rep">'+c.rep+'</span>'
    +(reading?'<span class="card__reading">正在讀 '+reading+'</span>':'')+'</span></a>';
  track.appendChild(li);
  strip.insertAdjacentHTML("beforeend","<span>"+(i+1)+"</span>");
});

/* 深讀筆記也在首頁佔一格。它不是分類，所以不走 data-key，
   計數器與捲動比例都改用 cardCount，不能再拿 HOMECATS.length 當總數。 */
const DEEPS = BOOKS.filter(b=>b.deep);
let cardCount = HOMECATS.length;
if(DEEPS.length){
  const li=document.createElement("li"); li.className="cell";
  li.innerHTML='<a class="card card--deep" href="#deep" data-dx="1">'
    +'<span class="card__name"><i>深讀筆記</i></span><span class="card__foot">'
    +'<span class="card__count">'+DEEPS.length+' 篇</span>'
    // 卡片副標列書名，超過兩本就收尾用「等」，免得卡片被撐爆
    +'<span class="card__rep">'
      +esc(DEEPS.slice(0,2).map(b=>clean(b.t)).join('、')+(DEEPS.length>2?' 等':''))
    +'</span></span></a>';
  track.appendChild(li);
  strip.insertAdjacentHTML("beforeend","<span>"+(++cardCount)+"</span>");
}
$("total").textContent=cardCount;

let gtarget=0, graf=null;
function onGWheel(e){
  if(e.ctrlKey) return; if(Math.abs(e.deltaX)>Math.abs(e.deltaY)) return;
  const max=gallery.scrollWidth-gallery.clientWidth;
  const px=e.deltaMode===1?e.deltaY*40:e.deltaMode===2?e.deltaY*gallery.clientHeight:e.deltaY;
  const at=gallery.scrollLeft;
  if((px>0&&at>=max-1)||(px<0&&at<=1)) return;
  e.preventDefault(); gtarget=Math.max(0,Math.min(max,gtarget+px));
  if(rm.matches){gallery.scrollLeft=gtarget;return;}
  gallery.style.scrollSnapType="none"; if(!graf) graf=requestAnimationFrame(gtick);
}
function gtick(){
  const cur=gallery.scrollLeft, next=cur+(gtarget-cur)*.12; gallery.scrollLeft=next;
  if(Math.abs(gtarget-next)>.5){graf=requestAnimationFrame(gtick);}
  else{graf=null; gallery.style.scrollSnapType="x mandatory";}
}
gallery.addEventListener("scroll",()=>{
  if(!graf) gtarget=gallery.scrollLeft;
  const max=gallery.scrollWidth-gallery.clientWidth;
  const i=max?Math.round(gallery.scrollLeft/max*(cardCount-1)):0;
  strip.style.transform="translateY(-"+(i*1.35)+"em)";
},{passive:true});
if(fine.matches) gallery.addEventListener("wheel",onGWheel,{passive:false});

/* ---------- 波浪擦除 ---------- */
const ctx=wipe.getContext("2d");
function sizeCanvas(){const d=Math.min(devicePixelRatio||1,2);wipe.width=innerWidth*d;wipe.height=innerHeight*d;}
function wave(color,p){
  const W=wipe.width,H=wipe.height,seg=Math.ceil(W/40),t=(1-p)*H,amp=300*Math.sin(p*Math.PI)*(W/1920);
  ctx.clearRect(0,0,W,H);ctx.beginPath();ctx.moveTo(W,H);ctx.lineTo(0,H);ctx.lineTo(0,t);
  for(let n=0;n<=seg;n++){const x=40*n;ctx.lineTo(x,t-Math.sin(x/W*Math.PI)*amp);}
  ctx.lineTo(W,t);ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
function sweep(color,from,to,ms){
  return new Promise(resolve=>{
    let settled=false; const done=()=>{if(settled)return;settled=true;wave(color,to);resolve();};
    if(rm.matches){done();return;}
    const t0=performance.now(), guard=setTimeout(done,ms+400);
    (function step(now){
      if(settled)return; const p=Math.min(1,(now-t0)/ms);
      const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2; wave(color,from+(to-from)*e);
      if(p<1){requestAnimationFrame(step);} else{clearTimeout(guard);done();}
    })(t0);
  });
}
function clearWipe(){ctx.clearRect(0,0,wipe.width,wipe.height);}

/* ---------- 3D 廊道 ---------- */
const cat=$("cat"), stage=$("stage"), world=$("world"), hud=$("hud");
const STEP=330, RX=520, RY=340, P=1100, NEAR=P*0.82, FAR=-2600, FADE=900;
let objs=[], camZ=0, camTarget=0, sraf=null, openKey=null, lastFocus=null;

function seed(i){const a=Math.sin((i+1)*12.9898)*43758.5453, b=Math.sin((i+1)*78.233)*43758.5453;
  return {x:(a-Math.floor(a))-.5, y:(b-Math.floor(b))-.5};}

function coverInner(b,accent){
  return b.cover
    ? '<img src="'+esc(b.cover)+'" alt="">'
    : '<span class="cover__dot" style="--accent:'+accent+'"></span>'
      +'<span class="cover__t">'+esc(clean(b.t))+'</span>'
      +'<span class="cover__a">'+esc(b.a||'')+'</span>';
}
function coverHTML(b,accent){
  return '<div class="cover" style="--c:'+(b._c||'#333')+'">'+coverInner(b,accent)+'</div>';
}
/* 聚焦用的有厚度 3D 書：封面 / 封底 / 書背 / 書口紙緣 */
function book3dHTML(b,accent){
  const dark=shade(b._c||'#333',.58);
  return '<div class="bk bk-front"><div class="cover" style="--c:'+(b._c||'#333')+'">'+coverInner(b,accent)+'</div></div>'
    +'<div class="bk bk-back" style="background:'+dark+'"></div>'
    +'<div class="bk bk-spine" style="background:'+dark+'"><span>'+esc(clean(b.t))+'</span></div>'
    +'<div class="bk bk-pages"></div>';
}

function buildStage(c){
  const books=byCat(c.key), accent=tint(c.color);
  cat.style.setProperty("--accent",accent);
  $("catTitle").innerHTML='<span class="cat__word">'+esc(c.name)+'</span>'
    +'<span class="cat__word--r">'+books.length+' 冊 · '+c.key+'</span>';
  world.innerHTML="";
  objs=books.map((b,i)=>{
    b._c=c.color;
    const s=seed(i), x=Math.round(s.x*RX), y=Math.round(s.y*RY), z=-i*STEP;
    const el=document.createElement("div");
    el.className="obj"; el.dataset.i=i;
    el.style.transform="translate3d("+x+"px,"+y+"px,"+z+"px)";
    el.style.filter="brightness("+(0.82+((Math.sin((i+1)*3.7)+1)/2)*0.32).toFixed(2)+")";
    el.innerHTML=coverHTML(b,accent);
    world.appendChild(el);
    return {el,x,y,z,b};
  });
  camTarget=camZ=STEP; // 從第一本略前方起步
  updateStage(true);
  const total=(books.length-1)*STEP;
  hud.innerHTML='<span>滾動穿過書櫃</span> · <b id="hudN">01</b> / '+String(books.length).padStart(2,"0");
  stage._total=total; stage._n=books.length;
}

function updateStage(instant){
  world.style.transform="translateZ("+camZ+"px)";
  let front=0, frontD=1e9;
  for(const o of objs){
    const eff=o.z+camZ;                 // 螢幕 z：越接近 P 越貼臉
    let op=1;
    if(eff>NEAR) op=0;                  // 穿過視點，隱藏
    else if(eff<FAR) op=0;              // 太遠
    else if(eff<FAR+FADE) op=(eff-FAR)/FADE;
    else if(eff>NEAR-260) op=Math.max(0,(NEAR-eff)/260);
    o.el.style.opacity=op;
    o.el.style.visibility = op<=0.02 ? "hidden":"visible";
    o.el.classList.toggle("is-dim", op<=0.02);
    const d=Math.abs(eff-(P*0.35));
    if(op>0.2 && d<frontD){frontD=d; front=+o.el.dataset.i;}
  }
  const hn=$("hudN"); if(hn) hn.textContent=String(front+1).padStart(2,"0");
}

function stick(){
  camZ += (camTarget-camZ)*0.09;
  updateStage();
  if(Math.abs(camTarget-camZ)>0.4){sraf=requestAnimationFrame(stick);}
  else{camZ=camTarget; updateStage(); sraf=null;}
}
function dolly(dz){
  const max=stage._total||0;
  camTarget=Math.max(STEP, Math.min(max+STEP, camTarget+dz));
  if(rm.matches){camZ=camTarget; updateStage(); return;}
  if(!sraf) sraf=requestAnimationFrame(stick);
}
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  const px=e.deltaMode===1?e.deltaY*40:e.deltaMode===2?e.deltaY*innerHeight:e.deltaY;
  dolly(px*1.1);
},{passive:false});
let drag=null, downObj=null, pickedAt=0;
/* 重要：stage 一旦 setPointerCapture，後續 click 事件的 target 會被改成 stage 本身，
   e.target.closest(".obj") 永遠是 null——真實滑鼠點書就完全沒反應。
   因此改成在 pointerdown 記住按到哪一本，pointerup 時用它來開啟，不依賴 click 的 target。 */
stage.addEventListener("pointerdown",e=>{
  downObj=e.target.closest? e.target.closest(".obj") : null;
  drag={y:e.clientY,base:camTarget,moved:0};
  try{stage.setPointerCapture(e.pointerId);}catch(_){}
});
stage.addEventListener("pointermove",e=>{if(!drag)return; const d=e.clientY-drag.y; drag.moved=Math.abs(d);
  camTarget=Math.max(STEP,Math.min((stage._total||0)+STEP,drag.base - d*2.4)); if(!sraf)sraf=requestAnimationFrame(stick);});
stage.addEventListener("pointerup",e=>{
  const moved=drag?drag.moved:0, el=downObj;
  drag=null; downObj=null;
  if(el && moved<=6){ pickedAt=Date.now(); openFocus(+el.dataset.i); }
});
stage.addEventListener("pointercancel",()=>{drag=null;downObj=null;});
stage.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();dolly(STEP);}
  if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();dolly(-STEP);}
});
/* 後備路徑：程式化 .click() 或輔助技術送出的 click（真實滑鼠已在 pointerup 處理完，
   用時間戳避免同一次操作開兩次） */
stage.addEventListener("click",e=>{
  if(Date.now()-pickedAt<400) return;
  const el=e.target.closest? e.target.closest(".obj") : null; if(!el) return;
  openFocus(+el.dataset.i);
});

/* ---------- 書籍詳情：大綱 / 觀點 / 各界評價 / 我的評語 ---------- */
function detailHTML(b){
  const r=b.res||{};
  let h="";
  /* 我的筆記放最前面 —— 這是這個書櫃唯一別人寫不出來的部分 */
  const hasNote=(b.note&&b.note.trim())||(b.quotes&&b.quotes.length)||(b.tags&&b.tags.length);
  if(hasNote){
    h+='<div class="sec"><p class="sec__h">我的筆記</p>';
    if(b.note&&b.note.trim()) h+='<p class="sec__body note">'+esc(b.note)+'</p>';
    if(b.quotes&&b.quotes.length){
      h+='<ul class="quotes">'+b.quotes.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ul>';
    }
    if(b.tags&&b.tags.length){
      h+='<p class="tags">'+b.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')+'</p>';
    }
    h+='</div>';
  }
  const outline=r.outline||b.syn||"";
  if(outline){
    h+='<div class="sec"><p class="sec__h">大綱</p>'
      +'<p class="sec__body">'+esc(outline)+'</p></div>';
  }
  if(r.points&&r.points.length){
    h+='<div class="sec"><p class="sec__h">書裡的觀點</p><ul class="pts">'
      +r.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul></div>';
  }
  if(r.reception&&r.reception.length){
    h+='<div class="sec"><p class="sec__h">各界評價</p><div class="rev">'
      +r.reception.map(x=>'<div class="rev__i"><p class="rev__s">'+esc(x.src)+'</p>'
        +'<p class="rev__t">'+esc(x.text)+'</p></div>').join('')+'</div></div>';
  }
  if(r.verdict){
    h+='<div class="sec"><div class="mine"><span class="mine__tag">評語</span>'
      +esc(r.verdict)+'</div></div>';
  }
  if(!h){
    h='<p class="nores">這本還沒有整理到資料。冷門書、雜誌、工具書網路上常常查不到，'
      +'與其編一段假的，不如空著。</p>';
  }else if(!r.found&&!outline){
    h+='<p class="nores">網路上查不到這本的實質資料，以上僅為我的判斷。</p>';
  }
  if(b.deep){
    h+='<a class="deep-link" data-deep="'+esc(b.id)+'">深讀筆記 →</a>';
  }
  if(r.sources&&r.sources.length){
    h+='<p class="srcs">資料來源：'+r.sources.slice(0,4).map(esc).join('　·　')+'</p>';
  }else if(outline&&!r.outline){
    h+='<p class="srcs">簡介來源：博客來</p>';
  }
  return h;
}

/* ---------- 聚焦：旋轉 + 資訊 ---------- */
const focus=$("focus"), focusSpin=$("focusSpin"), panel=$("panel");
function openFocus(i){
  /* 轉場中或已經離開類別頁時，一律不開書 */
  if(busy || !openKey || !cat.classList.contains("is-on")) return;
  const o=objs[i]; if(!o) return; const b=o.b;
  const accent=tint(CATS.find(c=>c.key===b.c).color);
  focusSpin.innerHTML=book3dHTML(b,accent);
  panel.innerHTML=
    '<p class="panel__kicker">'+esc(CATS.find(c=>c.key===b.c).name)+'</p>'
    +'<h2 class="panel__t">'+esc(b.t.replace(/（.*?）/g,''))+'</h2>'
    +'<p class="panel__a">'+esc(b.a||'作者待補')+'</p>'
    +'<div class="panel__meta">'
    +(b.pub?'出版　<b>'+esc(b.pub)+(b.yr?'　'+b.yr:'')+'</b><br>':'')
    +'在書櫃　<b>'+lyLabel(b.ly)+'</b><br>'
    +'擺法　<b>'+oriLabel(b.o)+'</b>'+(b.r?'　·　<b style="color:'+accent+'">正在讀</b>':'')
    +(b.rv?'<br><b style="color:'+accent+'">書名待你核對</b>':'')+'</div>'
    +detailHTML(b);
  panel.scrollTop=0;
  focus.classList.add("is-on");
  /* 書的詳情打開時，把類別層的按鈕收起來——否則兩顆 Close 疊在同一個位置，
     點到的會是上層那顆（關掉整個類別），詳情面板就關不掉了 */
  $("catClose").hidden=true; $("listBtn").hidden=true; $("homeBtn").hidden=true;
  cat.classList.add("is-focusing");
  $("focusClose").hidden=false;
  $("focusClose").focus();
}
function closeFocus(){
  focus.classList.remove("is-on"); $("focusClose").hidden=true;
  cat.classList.remove("is-focusing");
  /* 回到類別層，把該層的按鈕放回來 */
  if(openKey){ $("catClose").hidden=false; $("listBtn").hidden=false; $("homeBtn").hidden=false; }
  stage.focus();
}
/* 點面板以外的模糊背景也能關掉，多一條直覺的退路 */
focus.addEventListener("pointerdown",e=>{
  if(e.target===focus||e.target.classList.contains("focus__spinwrap")) closeFocus();
});
$("focusClose").addEventListener("click",closeFocus);

/* ---------- 清單檢視 ---------- */
const listview=$("listview");
function buildList(c){
  const books=byCat(c.key), reading=books.filter(b=>b.r), shelf=books.filter(b=>!b.r);
  const authors=new Set(books.map(b=>b.a).filter(Boolean)), review=books.filter(b=>b.rv).length;
  const row=(b,idx)=>'<li class="row'+(b.r?' is-reading':'')+(b.rv?' is-review':'')+'">'
    +'<span class="row__i">'+String(idx).padStart(2,"0")+'</span>'
    +'<span class="row__t">'+esc(b.t)+'</span><span class="row__a">'+esc(b.a||'—')+'</span></li>';
  let h='<p class="panel__kicker" style="--accent:'+tint(c.color)+';color:'+tint(c.color)+'">'+esc(c.name)+'</p>'
    +'<h1 class="lv__name">'+esc(c.name)+'</h1>'

/* 轉場鎖：期間 wipe 畫布吃掉所有點擊，並拒絕重入 */
let busy=false;
function setBusy(v){ busy=v; wipe.classList.toggle("is-busy",v); }

async function open(key){
  if(busy) return;
  const c=CATS.find(x=>x.key===key); if(!c) return;
  setBusy(true);
  openKey=key; lastFocus=document.activeElement;
  await sweep(c.color,0,1,1100);

  cat.classList.add("is-on"); $("catClose").hidden=false; $("listBtn").hidden=false; $("homeBtn").hidden=false;
  stage.focus();

  setBusy(false);
}
async function close(){
  if(busy) return;
  const c=CATS.find(x=>x.key===openKey)||CATS[0];
  setBusy(true);
  if(focus.classList.contains("is-on")) closeFocus();

  cat.classList.remove("is-on"); $("catClose").hidden=true; $("listBtn").hidden=true; $("homeBtn").hidden=true;
  if(sraf){cancelAnimationFrame(sraf);sraf=null;} openKey=null;
  if(lastFocus) lastFocus.focus();
  await sweep(c.color,1,0,1100); clearWipe();
  setBusy(false);
}

/* 索引頁和內頁都要顯示這組數字，算一次就好 */
function deepStats(d){
  const chs=d.chapters||[];
  const groups=chs.reduce((a,c)=>a.concat(c.groups||[]),[]);
  const chars=groups.reduce((n,g)=>n+(g.blocks||[]).reduce((m,b)=>m+(b.v||'').length,0),0);
  const nums=groups.reduce((a,g)=>a.concat((String(g.pages||'').match(/\d+/g)||[]).map(Number)),[]);
  return {
    chs, groups, chars,
    span: nums.length ? 'p.'+Math.min.apply(null,nums)+'–'+Math.max.apply(null,nums) : '',
    words: (Math.round(chars/100)*100).toLocaleString('en-US'),
    mins: Math.max(1,Math.round(chars/400))          // 中文細讀抓每分鐘 400 字
  };
}
function deepHTML(d,cover){
  const st=deepStats(d), mins=st.mins, span=st.span;
  /* 兩層目錄：側邊固定的那份只列章名，捲到哪一章才把該章的小標展開。
     四萬多字如果把 45 個小標全攤出來，目錄自己就比一屏還高。 */
  const toc=[], mtoc=[], body=[];
  let gi=0;
  st.chs.forEach((c,ci)=>{
    const first=gi, subs=[];
    const cite=b=>esc(d.titleShort||d.title)+(b.p?'　p.'+esc(b.p):'')
      +(b.kind?'　·　'+esc(b.kind):'');
    /* 章題詞：優先用原書自己的紅框標語。③ 和 ⑨ 兩章書上沒放紅框，
       退而挑該章最長的一句——短句多半是殘句，撐不起題詞。 */
    const qs=(c.groups||[]).reduce((a,g)=>a.concat((g.blocks||[]).filter(b=>b.t==='quote')),[]);
    const epi=qs.filter(b=>b.kind)[0]
      || qs.slice().sort((a,b)=>b.v.length-a.v.length)[0] || null;

    let s='<section class="deep__ch"><div class="deep__chhead">'
      /* 這個大字位代表的是章號。沒讀到章號就留空——退而取章名第一個字會變成
         連續好幾個「如」，〈結語〉還會變成一個「〈」，那不是資訊是雜訊。 */
      +(c.label?'<span class="deep__chbig" aria-hidden="true">'+esc(c.label)+'</span>':'')
      +'<p class="deep__chn">'+esc([c.label,c.span].filter(Boolean).join('　·　'))+'</p>'
      +'<h2 class="deep__cht">'+esc(c.title||'')+'</h2></div>'
      +(epi?'<blockquote class="deep__epi"><p>'+esc(epi.v)+'</p><cite>'+cite(epi)+'</cite></blockquote>':'');

    (c.groups||[]).forEach((g,ig)=>{
      // 書上用三顆紅星號分節：沒有小標的續段、或選讀跳頁的地方，就是換一景
      if(ig>0 && (!g.h || g.gap)) s+='<p class="deep__star" aria-hidden="true">✱ ✱ ✱</p>';
      s+='<div class="deep__g" id="dg-'+gi+'" data-ch="'+ci+'">';
      if(g.pages) s+='<p class="deep__pages">p.'+esc(String(g.pages).replace('-','–'))+'</p>';
      if(g.h) s+='<h3 class="deep__sh">'+esc(g.h)+'</h3>';
      (g.blocks||[]).forEach(b=>{
        if(b===epi) return;                          // 已經升格成題詞，不要再出現一次
        if(b.t==='quote'){
          s+='<blockquote class="deep__q'+(b.kind?' deep__q--box':'')+'"><p>'+esc(b.v)+'</p>'
            +'<cite>'+cite(b)+'</cite></blockquote>';
        }else{
          s+='<p class="deep__p">'+esc(b.v)+'</p>';
        }
      });
      s+='</div>';
      if(g.h) subs.push('<li><a href="#" data-sec="'+gi+'">'+esc(g.h)+'</a></li>');
      gi++;
    });
    body.push(s+'</section>');

    const label='<span class="pg">'+esc(c.span||'')+'</span>'
      +'<span class="lb">'+esc((c.label?c.label+' ':'')+(c.title||''))+'</span>';
    toc.push('<li class="deep__tc" data-ch="'+ci+'"><a href="#" data-sec="'+first+'">'+label+'</a>'
      +(subs.length?'<ol class="deep__tsub">'+subs.join('')+'</ol>':'')+'</li>');
    mtoc.push('<li><a href="#" data-sec="'+first+'">'+label+'</a></li>');
  });

  let h='<div class="deep__inner">'
    +'<header class="deep__head">'
    +'<div class="deep__cover">'+(cover?'<img src="'+esc(cover)+'" alt="">':'')+'</div>'
    +'<div>'
    +'<p class="deep__kicker">深讀筆記</p>'
    +'<h1 class="deep__h">'+esc(d.title)+'</h1>'
    +'<p class="deep__by">'+esc(d.author||'')+(d.pub?'　·　'+esc(d.pub):'')+'</p>'
    +'<dl class="deep__specs">'
    +(span?'<div><dt>涵蓋</dt><dd>'+esc(span)+'</dd></div>':'')
    +'<div><dt>篇幅</dt><dd>約 '+st.words+' 字</dd></div>'
    +'<div><dt>閱讀</dt><dd>約 '+mins+' 分鐘</dd></div>'
    +'<div><dt>章節</dt><dd>'+st.chs.length+' 章</dd></div>'
    +'</dl>'
    +(d.source?'<p class="deep__source">'+esc(d.source)+'</p>':'')
    +'</div></header>'
    /* 手機目錄預設收起來：這本書 40 章，攤開等於在正文前面擋一整面牆。
       收的是導航不是內文，跟「長文不要摺疊」不衝突。 */
    +'<details class="deep__tocm"><summary>目錄　'+st.chs.length+' 章</summary>'
    +'<ol>'+mtoc.join('')+'</ol></details>'
    +'<div class="deep__body">'
    +'<nav class="deep__toc"><h4>目錄</h4><ol>'+toc.join('')+'</ol></nav>'
    +'<div class="deep__col">'+body.join('');
  h+='<div class="deep__mine"><h3>我的心得</h3>'
    +(d.note&&d.note.trim()
      ? '<div class="body">'+esc(d.note).replace(/\n/g,'<br>')+'</div>'
      : '<p class="empty">還沒寫。這一段留給我自己。</p>')
    +'</div>';
  // 措辭要對得起實情：重述段落裡確實留著原書的句子，不能說成「並非原文照錄」。
  h+='<p class="deep__foot">這是讀書筆記：內文為重述，其中保留原書的部分語句；獨立引文標示頁碼。'
    +'<br>著作權屬原作者與出版社所有。</p>'
    +'</div></div></div>'
    +'<div class="deep__prog" aria-hidden="true"><i></i></div>'
    +'<button class="deep__nav" type="button">目錄</button>'
    +'<button class="deep__top" type="button" aria-label="回到頂端">↑</button>'
    +'<div class="deep__sheet"><div class="deep__sheet__in">'
    +'<div class="deep__sheet__hd"><span>目錄　'+st.chs.length+' 章</span>'
    +'<button class="deep__sheet__x" type="button">關閉</button></div>'
    +'<ol>'+mtoc.join('')+'</ol></div></div>';
  return h;
}

/* 目錄高亮與回頂部。捲動容器是 .deep 不是視窗，座標一律相對它算。 */
let deepSecs=[], deepLinks=[], deepChaps=[], deepTop=null, deepProg=null,
    deepTocBox=null, deepSheet=null, deepNav=null, deepLastCh=null, deepTick=false;
function deepSpy(){
  deepTick=false;
  if(deepProg){
    const room=deep.scrollHeight-deep.clientHeight;
    deepProg.style.transform="scaleX("+(room>0?Math.min(1,deep.scrollTop/room):0)+")";
  }
  if(!deepSecs.length) return;
  const line=deep.getBoundingClientRect().top+deep.clientHeight*.28;
  let cur=0;
  deepSecs.forEach((s,i)=>{ if(s.getBoundingClientRect().top<=line) cur=i; });
  deepLinks.forEach(a=>a.classList.toggle("is-cur",+a.dataset.sec===cur));
  // 章要一起標，側邊目錄靠它決定展開哪一章的小標
  const ch=deepSecs[cur].dataset.ch;
  deepChaps.forEach(el=>el.classList.toggle("is-cur",el.dataset.ch===ch));
  /* 40 章的目錄比視窗高得多，換章時要把當前章捲進視野，
     否則側邊欄會停在第 1 章而讀者已經在第 30 章。只在換章時動，
     不然使用者自己捲目錄會一直被拉回去。 */
  if(ch!==deepLastCh){
    deepLastCh=ch;
    const el=deepChaps.filter(e=>e.dataset.ch===ch)[0], box=deepTocBox;
    if(el&&box&&box.scrollHeight>box.clientHeight+1){
      const t=el.offsetTop, h=el.offsetHeight;
      if(t<box.scrollTop) box.scrollTop=t-8;
      else if(t+h>box.scrollTop+box.clientHeight) box.scrollTop=t+h-box.clientHeight+8;
    }
  }
  const deepIn=deep.scrollTop>deep.clientHeight*.6;
  if(deepTop) deepTop.classList.toggle("is-on",deepIn);
  if(deepNav) deepNav.classList.toggle("is-on",deepIn);
}
/* 這兩個 listener 只掛一次。每開一本只換上面那三個參考——
   若放進 openDeep 裡重掛，反覆開關之後同一個 spy 會被呼叫好幾次。 */
deep.addEventListener("scroll",()=>{ if(!deepTick){ deepTick=true; requestAnimationFrame(deepSpy); } });
/* 這篇有七萬像素高，跨章的平滑捲動會慢到沒有意義，遠距離改成直接跳 */
function deepGo(top){
  deep.scrollTo({top,behavior:Math.abs(top-deep.scrollTop)>6000?"auto":"smooth"});
}
function openSheet(){
  if(!deepSheet) return;
  deepSheet.classList.add("is-on");
  // 一打開就讓讀者看到自己在哪一章，不用自己找
  const cur=deepSheet.querySelector("[data-sec].is-cur");
  if(cur) deepSheet.scrollTop=Math.max(0,cur.offsetTop-deepSheet.clientHeight*.35);
}
function closeSheet(){ if(deepSheet) deepSheet.classList.remove("is-on"); }
deep.addEventListener("click",e=>{
  if(e.target.closest(".deep__nav")){ openSheet(); return; }
  if(e.target.closest(".deep__sheet__x")){ closeSheet(); return; }
  const a=e.target.closest("[data-sec]");
  if(a){
    e.preventDefault();
    closeSheet();
    const s=deepSecs[+a.dataset.sec];
    if(s) deepGo(s.getBoundingClientRect().top-deep.getBoundingClientRect().top+deep.scrollTop-24);
    return;
  }
  if(e.target.closest(".deep__top")){ closeSheet(); deepGo(0); return; }
  if(e.target===deepSheet) closeSheet();          // 點空白處關掉
});
function wireDeep(){
  deepSecs=[...deep.querySelectorAll(".deep__g")];
  deepLinks=[...deep.querySelectorAll("[data-sec]")];
  deepChaps=[...deep.querySelectorAll(".deep__tc")];
  deepTop=deep.querySelector(".deep__top");
  deepProg=deep.querySelector(".deep__prog i");
  deepTocBox=deep.querySelector(".deep__toc");
  deepSheet=deep.querySelector(".deep__sheet");
  deepNav=deep.querySelector(".deep__nav");
  deepLastCh=null;
  deepSpy();
}

const dx=$("dx"), dxInner=$("dxInner"), DXC="#C08A4E";
function dxHTML(metas){

    +'故事講完整，不壓成論點式摘要；書裡的原句照舊引用並標頁碼。</p><ul class="dx__list">';

      +'<div><div class="dx__t">'+esc(clean(b.t))+'</div>'

      +(m?'<div class="dx__specs"><span>'+esc(m.span)+'</span>'
        +'<span>約 '+m.words+' 字</span><span>約 '+m.mins+' 分鐘</span>'
        +'<span>'+m.chs.length+' 章</span></div>':'')
      +'<div class="dx__go">讀這篇 →</div></div></a></li>';
  });

    +'<p class="dx__foot">深讀筆記只挑少數幾本，會慢慢增加。'
    +'其他書的心得、劃線和標籤，收在書櫃裡各本書自己的面板。</p>';
}
/* 順手把內文抓進 deepCache，點進去就不用再等一次。
   篇數多到十幾篇以後這裡要改成只抓摘要，現在幾篇而已不值得先做。 */
function dxMeta(){
  return Promise.all(DEEPS.map(async b=>{
    try{
      if(!deepCache[b.id]){
        deepCache[b.id]=await fetch('deep/'+b.id+'.json',{cache:'no-cache'})
          .then(r=>r.ok?r.json():Promise.reject(new Error(String(r.status))));
      }
      return deepStats(deepCache[b.id]);
    }catch(_){ return null; }      // 抓不到就只是少顯示數字，不擋整頁
  }));
}
async function openDX(){
  if(busy) return;
  setBusy(true);
  lastFocus=document.activeElement;

  dxInner.innerHTML=dxHTML(null);          // 先出版面，數字等抓完再補
  dx.classList.add("is-on"); $("dxClose").hidden=false; dx.scrollTop=0;
  $("dxClose").focus();
  await sweep(DXC,1,0,1100); clearWipe();
  setBusy(false);
  dxMeta().then(ms=>{ if(dx.classList.contains("is-on")) dxInner.innerHTML=dxHTML(ms); });
}
async function closeDX(){
  if(busy) return;
  setBusy(true);
  await sweep(DXC,0,1,1100);
  dx.classList.remove("is-on"); $("dxClose").hidden=true;
  if(lastFocus) lastFocus.focus();
  await sweep(DXC,1,0,1100); clearWipe();
  setBusy(false);
}

/* ---------- 問書櫃 ---------- */
const ask=$("ask"), askOut=$("askOut"), askIn=$("askIn"), askGo=$("askGo");
let asking=false;
function openAsk(){ ask.classList.add("is-on"); $("askClose").hidden=false; askIn.focus(); }
function closeAsk(){ ask.classList.remove("is-on"); $("askClose").hidden=true; }
$("askLink").addEventListener("click",e=>{e.preventDefault();openAsk();});
$("askClose").addEventListener("click",closeAsk);
$("askEg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  askIn.value=b.textContent; $("askForm").requestSubmit();
});

$("askForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const q=askIn.value.trim();
  if(!q||asking) return;
  asking=true; askGo.disabled=true; askGo.textContent="…";
  askOut.textContent=""; askOut.insertAdjacentHTML("beforeend",'<span class="ask__cursor"></span>');
  try{
    const res=await fetch("/api/ask",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({question:q})
    });
    if(!res.ok){
      let msg="出了點問題，請再試一次。";
      try{ const j=await res.json(); if(j.error) msg=j.error; }catch(_){}
      askOut.textContent=msg;
      return;
    }
    /* 邊收邊印：整份書單很長，等全部跑完才顯示會像當掉 */
    const reader=res.body.getReader(), dec=new TextDecoder();
    let text="";
    for(;;){
      const {done,value}=await reader.read();
      if(done) break;
      text+=dec.decode(value,{stream:true});
      askOut.textContent=text;
      askOut.insertAdjacentHTML("beforeend",'<span class="ask__cursor"></span>');
    }
    askOut.textContent=text||"（沒有收到回答，請再試一次。）";
  }catch(err){
    console.error(err);
    askOut.textContent="連不上伺服器，請確認網路後再試。";
  }finally{
    asking=false; askGo.disabled=false; askGo.textContent="問";
  }
});

addEventListener("resize",sizeCanvas); sizeCanvas();
window.__shelf = { BOOKS, CATS };   // 除錯用

});
