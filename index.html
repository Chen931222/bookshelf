<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>書櫃</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141310'/%3E%3Crect x='8.5' y='5' width='15' height='22' rx='1.2' fill='%23F2ECE0'/%3E%3Crect x='8.5' y='5' width='3.4' height='22' fill='%23C08A4E'/%3E%3Cline x1='15' y1='9' x2='20.5' y2='9' stroke='%23141310' stroke-width='1.1'/%3E%3Cline x1='15' y1='12' x2='20.5' y2='12' stroke='%23141310' stroke-width='1.1'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141310;
  --paper:#F2ECE0;
  --dim:rgba(242,236,224,.42);
  --faint:rgba(242,236,224,.16);
  --card-w:clamp(210px,18.6vw,358px);
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--serif);
  -webkit-font-smoothing:antialiased}

.nav{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;justify-content:space-between;
  align-items:baseline;padding:clamp(20px,2.4vw,42px);mix-blend-mode:difference;pointer-events:none}
.nav>*{pointer-events:auto}
.nav__mark{font-size:clamp(17px,1.5vw,28px);font-weight:600;letter-spacing:.14em}
.nav__link{font-family:var(--mono);font-size:clamp(11px,.78vw,14px);letter-spacing:.16em;
  text-transform:uppercase;color:var(--paper);text-decoration:none;opacity:.65}
.nav__link:hover,.nav__link:focus-visible{opacity:1}

/* ---------- 首頁：橫向類別廊道 ---------- */
.gallery{position:fixed;inset:0;display:flex;align-items:center;
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  overscroll-behavior-x:contain;scrollbar-width:thin;
  scrollbar-color:rgba(242,236,224,.22) transparent}
.gallery::-webkit-scrollbar{height:3px}
.gallery::-webkit-scrollbar-thumb{background:rgba(242,236,224,.22)}
.gallery:focus-visible{outline:none}
.track{display:flex;align-items:center;list-style:none;
  gap:clamp(28px,5.52vw,106px);padding-inline:calc(50% - var(--card-w)/2)}
.cell{flex:none;min-width:0;scroll-snap-align:center;scroll-snap-stop:always}
.card{position:relative;display:block;text-decoration:none;color:inherit;
  width:var(--card-w);aspect-ratio:358/505;background:var(--c);
  filter:saturate(.6) brightness(.86);
  transition:filter .55s cubic-bezier(.2,.7,.2,1),transform .55s cubic-bezier(.2,.7,.2,1)}
.card:hover,.card:focus-visible{filter:none;transform:translateY(-10px)}
.card:focus-visible{outline:1px solid var(--paper);outline-offset:10px}
.card::before,.card::after{content:"";position:absolute;left:0;right:0;height:1px;
  background:rgba(242,236,224,.28)}
.card::before{top:13.5%}
.card::after{bottom:13.5%}
.card__name{position:absolute;top:15%;left:0;right:0;bottom:23%;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.card__name i{writing-mode:vertical-rl;text-orientation:upright;font-style:normal;
  font-size:clamp(26px,2.9vw,52px);font-weight:600;letter-spacing:.08em;line-height:1.12;color:var(--paper)}
.card__foot{position:absolute;left:0;right:0;bottom:4.4%;text-align:center;padding:0 8%}
.card__count{display:block;font-family:var(--mono);font-size:clamp(10px,.63vw,12px);letter-spacing:.18em;color:var(--paper)}
.card__rep{display:block;font-size:clamp(10.5px,.63vw,12px);line-height:1.6;color:rgba(242,236,224,.62);letter-spacing:.03em;margin-top:9px}
.card__reading{display:block;font-family:var(--mono);font-size:clamp(9px,.5vw,10px);letter-spacing:.12em;color:rgba(242,236,224,.5);margin-top:6px}

.counter{position:fixed;left:50%;bottom:clamp(24px,2.6vw,46px);transform:translateX(-50%);
  z-index:40;display:flex;align-items:center;gap:9px;font-family:var(--mono);
  font-size:clamp(11px,.73vw,14px);letter-spacing:.1em;mix-blend-mode:difference;pointer-events:none}
.counter__win{height:1.35em;width:1.6em;overflow:hidden;position:relative}
.counter__strip{position:absolute;inset:0 0 auto 0;text-align:center;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.counter__strip span{display:block;height:1.35em;line-height:1.35em}
.counter__dash,.counter__tot{color:var(--dim)}
.hint{position:fixed;left:clamp(20px,2.4vw,42px);bottom:clamp(24px,2.6vw,46px);z-index:40;
  font-family:var(--mono);font-size:clamp(10px,.6vw,11px);letter-spacing:.2em;
  text-transform:uppercase;color:var(--dim);mix-blend-mode:difference;pointer-events:none}
.wipe{position:fixed;inset:0;width:100%;height:100%;z-index:90;pointer-events:none}

/* ---------- 類別頁：3D 封面廊道 ---------- */
.cat{position:fixed;inset:0;z-index:60;visibility:hidden;opacity:0;background:var(--ink)}
.cat.is-on{visibility:visible;opacity:1}
.cat__title{position:fixed;top:0;left:0;right:0;z-index:66;display:flex;justify-content:space-between;
  align-items:baseline;padding:clamp(20px,2.4vw,42px);pointer-events:none;mix-blend-mode:difference}
.cat__word{font-size:clamp(15px,1.4vw,26px);font-weight:600;letter-spacing:.2em;color:var(--paper)}
.cat__word--r{font-family:var(--mono);font-size:clamp(11px,.8vw,14px);letter-spacing:.22em;
  text-transform:uppercase;font-weight:400;color:var(--dim)}

.stage{position:absolute;inset:0;perspective:1100px;perspective-origin:50% 47%;
  overflow:hidden;touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;
  will-change:transform}
.obj{position:absolute;left:0;top:0;width:150px;height:216px;margin:-108px 0 0 -75px;
  transform-style:preserve-3d;cursor:pointer;transition:opacity .18s linear}
.cover{position:absolute;inset:0;background:var(--c);overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.55);display:flex;flex-direction:column;
  justify-content:space-between;padding:14px 12px;backface-visibility:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover__t{writing-mode:vertical-rl;text-orientation:upright;font-weight:600;
  font-size:16px;line-height:1.15;letter-spacing:.06em;color:var(--paper);
  align-self:flex-end;max-height:78%;overflow:hidden}
.cover__a{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:rgba(242,236,224,.6);
  writing-mode:horizontal-tb}
.cover__dot{position:absolute;top:9px;left:9px;width:6px;height:6px;border-radius:50%;
  background:var(--accent)}
.obj.is-dim{pointer-events:none}

.hud{position:fixed;left:50%;bottom:clamp(20px,2.6vw,40px);transform:translateX(-50%);z-index:66;
  display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:clamp(10px,.72vw,12px);
  letter-spacing:.14em;color:var(--dim);mix-blend-mode:difference;pointer-events:none}
.hud b{color:var(--paper);font-weight:400}

.cat__close,.cat__list-btn{position:fixed;z-index:70;border:1px solid var(--faint);
  background:var(--ink);color:var(--paper);font-family:var(--mono);letter-spacing:.1em;
  cursor:pointer;transition:border-color .35s}
.cat__close{top:clamp(18px,2.2vw,38px);right:clamp(20px,2.4vw,42px);
  width:clamp(60px,3.8vw,74px);aspect-ratio:1;border-radius:50%;font-size:clamp(10px,.66vw,12px)}
.cat__list-btn{bottom:clamp(20px,2.6vw,40px);right:clamp(20px,2.4vw,42px);
  padding:10px 16px;border-radius:var(--radius,8px);font-size:clamp(10px,.66vw,12px);
  text-transform:uppercase}
.cat__close:hover,.cat__list-btn:hover{border-color:var(--paper)}
.cat__close[hidden],.cat__list-btn[hidden]{display:none}

.home-btn{position:fixed;bottom:clamp(20px,2.6vw,40px);left:clamp(20px,2.4vw,42px);z-index:72;
  padding:10px 18px;border:1px solid var(--faint);border-radius:8px;background:var(--ink);
  color:var(--paper);font-family:var(--mono);font-size:clamp(10px,.66vw,12px);
  letter-spacing:.14em;cursor:pointer;transition:border-color .35s}
.home-btn:hover{border-color:var(--paper)}
.home-btn[hidden]{display:none}

/* 聚焦：封面旋轉 + 右側資訊 */
.focus{position:fixed;inset:0;z-index:68;visibility:hidden;opacity:0;
  background:rgba(10,9,8,.55);backdrop-filter:blur(18px) saturate(.7);
  -webkit-backdrop-filter:blur(18px) saturate(.7);
  display:grid;grid-template-columns:1fr minmax(320px,38%);
  transition:opacity .5s}
.focus.is-on{visibility:visible;opacity:1}
.focus__spinwrap{display:flex;align-items:center;justify-content:center;perspective:1400px}
.focus__spin{width:248px;height:357px;transform-style:preserve-3d;
  animation:spin 10s linear infinite;filter:drop-shadow(0 34px 70px rgba(0,0,0,.6))}
.bk{position:absolute;top:50%;left:50%}
.bk-front{width:248px;height:357px;transform:translate(-50%,-50%) translateZ(11px)}
.bk-front .cover{position:absolute;inset:0;box-shadow:none}
.bk-back{width:248px;height:357px;transform:translate(-50%,-50%) rotateY(180deg) translateZ(11px);
  box-shadow:inset 0 0 70px rgba(0,0,0,.45)}
.bk-spine{width:22px;height:357px;transform:translate(-50%,-50%) rotateY(-90deg) translateZ(124px);
  display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 30px rgba(0,0,0,.5)}
.bk-spine span{writing-mode:vertical-rl;text-orientation:upright;font-size:11px;font-weight:500;
  letter-spacing:.08em;color:var(--paper);opacity:.9;max-height:86%;overflow:hidden}
.bk-pages{width:22px;height:357px;transform:translate(-50%,-50%) rotateY(90deg) translateZ(124px);
  background:repeating-linear-gradient(90deg,#E9E1D1,#E9E1D1 1px,#d3caB8 1px,#d3caB8 2px)}
@keyframes spin{from{transform:rotateY(-18deg)}to{transform:rotateY(342deg)}}
.panel{align-self:center;padding:clamp(28px,4vw,64px) clamp(28px,4vw,60px) clamp(28px,4vw,64px) 0;
  max-height:100vh;overflow-y:auto}
.panel__kicker{font-family:var(--mono);font-size:clamp(10px,.66vw,12px);letter-spacing:.24em;
  text-transform:uppercase;color:var(--accent)}
.panel__t{font-size:clamp(30px,3.6vw,54px);font-weight:600;line-height:1.08;margin-top:.3em}
.panel__a{font-size:clamp(14px,1vw,17px);color:var(--dim);margin-top:1em;letter-spacing:.04em}
.panel__meta{margin-top:2em;border-top:1px solid var(--faint);padding-top:1.4em;
  font-family:var(--mono);font-size:clamp(11px,.78vw,13px);line-height:2.1;color:var(--dim)}
.panel__meta b{color:var(--paper);font-weight:400;letter-spacing:.02em}
.panel__syn{margin-top:2em;font-size:clamp(13px,.95vw,16px);line-height:1.85;color:rgba(242,236,224,.78)}
.focus__close{position:fixed;top:clamp(18px,2.2vw,38px);right:clamp(20px,2.4vw,42px);z-index:69;
  width:clamp(60px,3.8vw,74px);aspect-ratio:1;border-radius:50%;border:1px solid var(--faint);
  background:none;color:var(--paper);font-family:var(--mono);font-size:clamp(10px,.66vw,12px);
  letter-spacing:.1em;cursor:pointer;transition:border-color .35s}
.focus__close:hover{border-color:var(--paper)}

/* 清單檢視（可及性 / reduced-motion 後備） */
.listview{position:fixed;inset:0;z-index:64;background:var(--ink);overflow-y:auto;
  visibility:hidden;opacity:0}
.listview.is-on{visibility:visible;opacity:1}
.listview__inner{max-width:min(1100px,92vw);margin:0 auto;padding:clamp(40px,7vh,110px) 0 120px}
.lv__name{font-size:clamp(48px,9vw,120px);font-weight:600;line-height:.94;letter-spacing:.02em}
.lv__meta{margin-top:1.4em;font-family:var(--mono);font-size:clamp(11px,.85vw,14px);color:var(--dim);line-height:1.9}
.lv__list{list-style:none;margin-top:clamp(30px,5vh,56px)}
.row{display:flex;align-items:baseline;gap:16px;padding:13px 0;border-bottom:1px solid var(--faint)}
.row__i{flex:none;width:2.6em;font-family:var(--mono);font-size:clamp(10px,.7vw,12px);color:var(--dim)}
.row__t{flex:1 1 auto;min-width:0;font-size:clamp(16px,1.3vw,21px);line-height:1.35;font-weight:500}
.row__a{flex:none;font-family:var(--mono);font-size:clamp(10px,.72vw,12px);color:var(--dim);text-align:right;max-width:36%}
.row.is-reading .row__t::after{content:"　正在讀";font-family:var(--mono);font-size:.62em;letter-spacing:.14em;color:var(--accent);vertical-align:.15em}
.row.is-review{opacity:.6}
.row.is-review .row__t::before{content:"⌇ ";color:var(--accent)}

/* 留言 / 推薦 */
.book-nav{position:fixed;top:0;right:0;z-index:41;display:flex;gap:clamp(14px,1.6vw,26px);
  align-items:baseline;padding:clamp(20px,2.4vw,42px);pointer-events:none;mix-blend-mode:difference}
.book-nav a{pointer-events:auto;font-family:var(--mono);font-size:clamp(11px,.78vw,14px);
  letter-spacing:.16em;text-transform:uppercase;color:var(--paper);text-decoration:none;opacity:.65}
.book-nav a:hover,.book-nav a:focus-visible{opacity:1}
.guest{position:fixed;inset:0;z-index:64;background:var(--ink);overflow-y:auto;visibility:hidden;opacity:0}
.guest.is-on{visibility:visible;opacity:1}
.guest__inner{max-width:min(760px,90vw);margin:0 auto;padding:clamp(48px,10vh,140px) 0 120px}
.guest__kicker{font-family:var(--mono);font-size:clamp(10px,.72vw,12px);letter-spacing:.24em;
  text-transform:uppercase;color:var(--dim)}
.guest__h{font-size:clamp(40px,7vw,84px);font-weight:600;line-height:1;margin-top:.2em}
.guest__sub{margin-top:1.2em;font-size:clamp(13px,.95vw,16px);line-height:1.8;color:rgba(242,236,224,.7)}
.guest__wait{margin-top:2.4em;padding:1.4em 1.6em;border:1px solid var(--faint);border-radius:12px;
  font-family:var(--mono);font-size:clamp(11px,.8vw,13px);line-height:1.9;color:var(--dim)}
#waline{margin-top:clamp(30px,5vh,56px)}
/* Waline 深色編輯風覆寫 */
#waline{
  --waline-theme-color:#C08A4E;--waline-active-color:#E0A968;
  --waline-font-size:15px;--waline-white:#F2ECE0;--waline-dark-grey:#8b857a;
  --waline-color:#F2ECE0;--waline-bgcolor:transparent;--waline-bgcolor-light:rgba(242,236,224,.04);
  --waline-bgcolor-hover:rgba(242,236,224,.08);--waline-border-color:rgba(242,236,224,.16);
  --waline-disable-bgcolor:rgba(242,236,224,.06);--waline-disable-color:#6b665d;
  --waline-bq-color:rgba(242,236,224,.2);--waline-info-bgcolor:rgba(242,236,224,.03);
  --waline-info-color:#8b857a;--waline-border:1px solid rgba(242,236,224,.16);
  font-family:var(--serif)}
#waline .wl-editor,#waline .wl-input{color:var(--paper)}
#waline .wl-btn{border-color:rgba(242,236,224,.24)}

@media (max-width:767px){
  :root{--card-w:62vw}
  .track{gap:10vw}
  .focus{grid-template-columns:1fr}
  .focus__spinwrap{align-items:flex-end;padding-top:12vh}
  .panel{align-self:start;padding:24px 22px 40px}
  .panel__meta{border-top:none;padding-top:.6em}
}
@media (prefers-reduced-motion:reduce){
  .card,.counter__strip{transition:none}
  .focus__spin{animation:none}
}
</style>
</head>
<body>

<nav class="nav" id="homeNav">
  <span class="nav__mark">書櫃</span>
</nav>
<div class="book-nav" id="bookNav">
  <a href="#留言" id="guestLink">留言</a>
  <a href="#其他" id="miscLink">其他</a>
</div>

<div class="gallery" id="gallery" tabindex="0" role="region" aria-label="書櫃分類，可橫向捲動">
  <ul class="track" id="track"></ul>
</div>

<div class="counter" aria-hidden="true">
  <span class="counter__win"><span class="counter__strip" id="strip"></span></span>
  <span class="counter__dash">—</span><span class="counter__tot" id="total"></span>
</div>
<p class="hint">滾動 · 點類別看書</p>
<canvas class="wipe" id="wipe"></canvas>

<!-- 類別頁：3D 廊道 -->
<section class="cat" id="cat" aria-modal="true" role="dialog">
  <div class="cat__title" id="catTitle"></div>
  <div class="stage" id="stage" tabindex="0"><div class="world" id="world"></div></div>
  <div class="hud" id="hud"></div>
</section>
<button class="cat__close" id="catClose" hidden>Close</button>
<button class="cat__list-btn" id="listBtn" hidden>清單</button>
<button class="home-btn" id="homeBtn" hidden>回主頁</button>

<!-- 聚焦：旋轉封面 + 資訊 -->
<div class="focus" id="focus">
  <div class="focus__spinwrap"><div class="focus__spin" id="focusSpin"></div></div>
  <div class="panel" id="panel"></div>
</div>
<button class="focus__close" id="focusClose" hidden>Close</button>

<!-- 清單檢視 -->
<div class="listview" id="listview"><div class="listview__inner" id="lvInner"></div></div>
<button class="cat__close" id="lvClose" hidden style="z-index:71">Close</button>

<!-- 留言 / 推薦 -->
<section class="guest" id="guest" aria-label="留言與推薦">
  <div class="guest__inner">
    <p class="guest__kicker">Guestbook</p>
    <h1 class="guest__h">留言 · 推薦一本書</h1>
    <p class="guest__sub">看完這座書櫃，留下你的一句話，或推薦一本你覺得該進來的書。不用登入，寫個暱稱就好。</p>
    <div id="waline"></div>
    <div class="guest__wait" id="guestWait" hidden>留言功能設定中，很快開放。<br>（後端已部署，等資料庫接上就會亮起來。）</div>
  </div>
</section>
<button class="cat__close" id="guestClose" hidden style="z-index:71">Close</button>

<script>
const CATS = [
  {key:"lit",   name:"文學與故事", color:"#5A2A2E", rep:"蘇菲的世界　喬斯坦·賈德"},
  {key:"money", name:"商業與溝通", color:"#2E4034", rep:"原子習慣　詹姆斯·克利爾"},
  {key:"world", name:"看懂世界",   color:"#2A3A4A", rep:"槍炮、病菌與鋼鐵　賈德·戴蒙"},
  {key:"lang",  name:"原文與語言", color:"#3B3550", rep:"The Old Man and the Sea　Hemingway"},
  {key:"mag",   name:"雜誌牆",     color:"#6B5320", rep:"國家地理　National Geographic"},
  {key:"comic", name:"漫畫・童書", color:"#2E4848", rep:"哆啦A夢　藤子·F·不二雄"},
  {key:"misc",  name:"其他・待指認", color:"#43423E", rep:"讀不清的、教科書、族譜", hidden:true}
];

/* t=書名 a=作者 c=類別 ly=層 o=擺法 r=正在讀 rv=待核對 cover=封面檔(暫無) */
const BOOKS = [
  {t:"傷心咖啡店之歌",a:"朱少麟",c:"lit",ly:1,o:"spine",cover:"covers/lit-01.webp",pub:"九歌",yr:2014,syn:"深藍色燈光的傷心咖啡店，讓人暫時忘卻煩惱憂傷…… 他們在咖啡店中吶喊自由，開展傳奇，說出都會人內在自我最真實的心聲。"},

const byCat = k => BOOKS.filter(b => b.c === k);
const $ = id => document.getElementById(id);
const rm   = matchMedia("(prefers-reduced-motion: reduce)");
const fine = matchMedia("(hover: hover) and (pointer: fine)");
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const tint = hex => { const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255,f=.55;
  r=Math.round(r+(255-r)*f);g=Math.round(g+(255-g)*f);b=Math.round(b+(255-b)*f);return `rgb(${r},${g},${b})`; };
const shade = (hex,f) => { const n=parseInt(hex.slice(1),16);
  return `rgb(${Math.round((n>>16&255)*f)},${Math.round((n>>8&255)*f)},${Math.round((n&255)*f)})`; };
const clean = t => String(t).replace(/（.*?）/g,'');
const lyLabel = ly => ly===0 ? "手邊（正在讀）" : ["","第一層","第二層","第三層","第四層"][ly] || "—";
const oriLabel = o => ({spine:"書背朝外",face:"封面朝外",flat:"平放"})[o] || o;

const HOMECATS = CATS.filter(c=>!c.hidden);
HOMECATS.forEach((c,i)=>{
  const books=byCat(c.key), reading=books.filter(b=>b.r).length;
  const li=document.createElement("li"); li.className="cell";
  li.innerHTML='<a class="card" href="#'+c.key+'" style="--c:'+c.color+'" data-key="'+c.key+'">'
    +'<span class="card__name"><i>'+c.name+'</i></span><span class="card__foot">'
    +'<span class="card__count">'+books.length+' 冊</span>'

    +(reading?'<span class="card__reading">正在讀 '+reading+'</span>':'')+'</span></a>';
  track.appendChild(li);
  strip.insertAdjacentHTML("beforeend","<span>"+(i+1)+"</span>");
});
$("total").textContent=HOMECATS.length;

let gtarget=0, graf=null;
function onGWheel(e){
  if(e.ctrlKey) return; if(Math.abs(e.deltaX)>Math.abs(e.deltaY)) return;
  const max=gallery.scrollWidth-gallery.clientWidth;
  const px=e.deltaMode===1?e.deltaY*40:e.deltaMode===2?e.deltaY*gallery.clientHeight:e.deltaY;
  const at=gallery.scrollLeft;
  if((px>0&&at>=max-1)||(px<0&&at<=1)) return;
  e.preventDefault(); gtarget=Math.max(0,Math.min(max,gtarget+px));
  if(rm.matches){gallery.scrollLeft=gtarget;return;}
  gallery.style.scrollSnapType="none"; if(!graf) graf=requestAnimationFrame(gtick);
}
function gtick(){
  const cur=gallery.scrollLeft, next=cur+(gtarget-cur)*.12; gallery.scrollLeft=next;
  if(Math.abs(gtarget-next)>.5){graf=requestAnimationFrame(gtick);}
  else{graf=null; gallery.style.scrollSnapType="x mandatory";}
}
gallery.addEventListener("scroll",()=>{
  if(!graf) gtarget=gallery.scrollLeft;
  const max=gallery.scrollWidth-gallery.clientWidth;
  const i=max?Math.round(gallery.scrollLeft/max*(HOMECATS.length-1)):0;
  strip.style.transform="translateY(-"+(i*1.35)+"em)";
},{passive:true});
if(fine.matches) gallery.addEventListener("wheel",onGWheel,{passive:false});

/* ---------- 波浪擦除 ---------- */
const ctx=wipe.getContext("2d");
function sizeCanvas(){const d=Math.min(devicePixelRatio||1,2);wipe.width=innerWidth*d;wipe.height=innerHeight*d;}
function wave(color,p){
  const W=wipe.width,H=wipe.height,seg=Math.ceil(W/40),t=(1-p)*H,amp=300*Math.sin(p*Math.PI)*(W/1920);
  ctx.clearRect(0,0,W,H);ctx.beginPath();ctx.moveTo(W,H);ctx.lineTo(0,H);ctx.lineTo(0,t);
  for(let n=0;n<=seg;n++){const x=40*n;ctx.lineTo(x,t-Math.sin(x/W*Math.PI)*amp);}
  ctx.lineTo(W,t);ctx.closePath();ctx.fillStyle=color;ctx.fill();
}
function sweep(color,from,to,ms){
  return new Promise(resolve=>{
    let settled=false; const done=()=>{if(settled)return;settled=true;wave(color,to);resolve();};
    if(rm.matches){done();return;}
    const t0=performance.now(), guard=setTimeout(done,ms+400);
    (function step(now){
      if(settled)return; const p=Math.min(1,(now-t0)/ms);
      const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2; wave(color,from+(to-from)*e);
      if(p<1){requestAnimationFrame(step);} else{clearTimeout(guard);done();}
    })(t0);
  });
}
function clearWipe(){ctx.clearRect(0,0,wipe.width,wipe.height);}

/* ---------- 3D 廊道 ---------- */
const cat=$("cat"), stage=$("stage"), world=$("world"), hud=$("hud");
const STEP=330, RX=520, RY=340, P=1100, NEAR=P*0.82, FAR=-2600, FADE=900;
let objs=[], camZ=0, camTarget=0, sraf=null, openKey=null, lastFocus=null;

function seed(i){const a=Math.sin((i+1)*12.9898)*43758.5453, b=Math.sin((i+1)*78.233)*43758.5453;
  return {x:(a-Math.floor(a))-.5, y:(b-Math.floor(b))-.5};}

function coverInner(b,accent){
  return b.cover
    ? '<img src="'+esc(b.cover)+'" alt="">'
    : '<span class="cover__dot" style="--accent:'+accent+'"></span>'
      +'<span class="cover__t">'+esc(clean(b.t))+'</span>'
      +'<span class="cover__a">'+esc(b.a||'')+'</span>';
}
function coverHTML(b,accent){
  return '<div class="cover" style="--c:'+(b._c||'#333')+'">'+coverInner(b,accent)+'</div>';
}
/* 聚焦用的有厚度 3D 書：封面 / 封底 / 書背 / 書口紙緣 */
function book3dHTML(b,accent){
  const dark=shade(b._c||'#333',.58);
  return '<div class="bk bk-front"><div class="cover" style="--c:'+(b._c||'#333')+'">'+coverInner(b,accent)+'</div></div>'
    +'<div class="bk bk-back" style="background:'+dark+'"></div>'
    +'<div class="bk bk-spine" style="background:'+dark+'"><span>'+esc(clean(b.t))+'</span></div>'
    +'<div class="bk bk-pages"></div>';
}

function buildStage(c){
  const books=byCat(c.key), accent=tint(c.color);
  cat.style.setProperty("--accent",accent);
  $("catTitle").innerHTML='<span class="cat__word">'+esc(c.name)+'</span>'
    +'<span class="cat__word--r">'+books.length+' 冊 · '+c.key+'</span>';
  world.innerHTML="";
  objs=books.map((b,i)=>{
    b._c=c.color;
    const s=seed(i), x=Math.round(s.x*RX), y=Math.round(s.y*RY), z=-i*STEP;
    const el=document.createElement("div");
    el.className="obj"; el.dataset.i=i;
    el.style.transform="translate3d("+x+"px,"+y+"px,"+z+"px)";
    el.style.filter="brightness("+(0.82+((Math.sin((i+1)*3.7)+1)/2)*0.32).toFixed(2)+")";
    el.innerHTML=coverHTML(b,accent);
    world.appendChild(el);
    return {el,x,y,z,b};
  });
  camTarget=camZ=STEP; // 從第一本略前方起步
  updateStage(true);
  const total=(books.length-1)*STEP;
  hud.innerHTML='<span>滾動穿過書櫃</span> · <b id="hudN">01</b> / '+String(books.length).padStart(2,"0");
  stage._total=total; stage._n=books.length;
}

function updateStage(instant){
  world.style.transform="translateZ("+camZ+"px)";
  let front=0, frontD=1e9;
  for(const o of objs){
    const eff=o.z+camZ;                 // 螢幕 z：越接近 P 越貼臉
    let op=1;
    if(eff>NEAR) op=0;                  // 穿過視點，隱藏
    else if(eff<FAR) op=0;              // 太遠
    else if(eff<FAR+FADE) op=(eff-FAR)/FADE;
    else if(eff>NEAR-260) op=Math.max(0,(NEAR-eff)/260);
    o.el.style.opacity=op;
    o.el.style.visibility = op<=0.02 ? "hidden":"visible";
    o.el.classList.toggle("is-dim", op<=0.02);
    const d=Math.abs(eff-(P*0.35));
    if(op>0.2 && d<frontD){frontD=d; front=+o.el.dataset.i;}
  }
  const hn=$("hudN"); if(hn) hn.textContent=String(front+1).padStart(2,"0");
}

function stick(){
  camZ += (camTarget-camZ)*0.09;
  updateStage();
  if(Math.abs(camTarget-camZ)>0.4){sraf=requestAnimationFrame(stick);}
  else{camZ=camTarget; updateStage(); sraf=null;}
}
function dolly(dz){
  const max=stage._total||0;
  camTarget=Math.max(STEP, Math.min(max+STEP, camTarget+dz));
  if(rm.matches){camZ=camTarget; updateStage(); return;}
  if(!sraf) sraf=requestAnimationFrame(stick);
}
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  const px=e.deltaMode===1?e.deltaY*40:e.deltaMode===2?e.deltaY*innerHeight:e.deltaY;
  dolly(px*1.1);
},{passive:false});
let drag=null;
stage.addEventListener("pointerdown",e=>{drag={y:e.clientY,base:camTarget,moved:0};stage.setPointerCapture(e.pointerId);});
stage.addEventListener("pointermove",e=>{if(!drag)return; const d=e.clientY-drag.y; drag.moved=Math.abs(d);
  camTarget=Math.max(STEP,Math.min((stage._total||0)+STEP,drag.base - d*2.4)); if(!sraf)sraf=requestAnimationFrame(stick);});
stage.addEventListener("pointerup",e=>{drag=null;});
stage.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown"){e.preventDefault();dolly(STEP);}
  if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();dolly(-STEP);}
});
stage.addEventListener("click",e=>{
  const el=e.target.closest(".obj"); if(!el) return;
  if(drag && drag.moved>6) return;
  openFocus(+el.dataset.i);
});

const listview=$("listview");
function buildList(c){
  const books=byCat(c.key), reading=books.filter(b=>b.r), shelf=books.filter(b=>!b.r);
  const authors=new Set(books.map(b=>b.a).filter(Boolean)), review=books.filter(b=>b.rv).length;
  const row=(b,idx)=>'<li class="row'+(b.r?' is-reading':'')+(b.rv?' is-review':'')+'">'
    +'<span class="row__i">'+String(idx).padStart(2,"0")+'</span>'
    +'<span class="row__t">'+esc(b.t)+'</span><span class="row__a">'+esc(b.a||'—')+'</span></li>';
  let h='<p class="panel__kicker" style="--accent:'+tint(c.color)+';color:'+tint(c.color)+'">'+esc(c.name)+'</p>'
    +'<h1 class="lv__name">'+esc(c.name)+'</h1>'
    +'<div class="lv__meta"><b style="color:var(--paper)">'+books.length+'</b> 冊 · <b style="color:var(--paper)">'+authors.size+'</b> 位作者'
    +(reading.length?' · <b style="color:var(--paper)">'+reading.length+'</b> 本正在讀':'')
    +(review?'<br>'+review+' 本待你核對（⌇）':'')+'</div>';
  if(reading.length) h+='<ul class="lv__list">'+reading.map((b,i)=>row(b,i+1)).join('')+'</ul>';
  h+='<ul class="lv__list">'+shelf.map((b,i)=>row(b,i+1)).join('')+'</ul>';
  $("lvInner").innerHTML=h;
}
function openList(){buildList(CATS.find(c=>c.key===openKey)); listview.classList.add("is-on"); $("lvClose").hidden=false;}

/* ---------- 開關類別 ---------- */
async function open(key){
  const c=CATS.find(x=>x.key===key); if(!c) return; openKey=key; lastFocus=document.activeElement;
  await sweep(c.color,0,1,1100);
  buildStage(c);
  cat.classList.add("is-on"); $("catClose").hidden=false; $("listBtn").hidden=false; $("homeBtn").hidden=false;
  stage.focus();
  await sweep(c.color,1,0,1100); clearWipe();
}
async function close(){
  const c=CATS.find(x=>x.key===openKey)||CATS[0];
  if(focus.classList.contains("is-on")) closeFocus();
  if(listview.classList.contains("is-on")) closeList();
  await sweep(c.color,0,1,1100);
  cat.classList.remove("is-on"); $("catClose").hidden=true; $("listBtn").hidden=true; $("homeBtn").hidden=true;
  if(sraf){cancelAnimationFrame(sraf);sraf=null;} openKey=null;
  if(lastFocus) lastFocus.focus();
  await sweep(c.color,1,0,1100); clearWipe();
}
track.addEventListener("click",e=>{const card=e.target.closest(".card"); if(!card)return; e.preventDefault(); open(card.dataset.key);});
$("miscLink").addEventListener("click",e=>{e.preventDefault();open("misc");});
$("catClose").addEventListener("click",close);
$("homeBtn").addEventListener("click",close);
addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if(focus.classList.contains("is-on")) closeFocus();
  else if(listview.classList.contains("is-on")) closeList();
  else if(guest.classList.contains("is-on")) closeGuest();
  else if(openKey) close();
});

/* ---------- 留言 / 推薦（Waline） ---------- */
const GUEST_SERVER="https://bookshelf-comments.vercel.app";
const guest=$("guest");
let walineLoaded=false;
async function initWaline(){
  if(walineLoaded) return;
  // 健康檢查：後端 + 資料庫都就緒才掛載，否則顯示「設定中」
  let ok=false;
  try{
    const r=await fetch(GUEST_SERVER+"/api/comment?path=%2F&type=count",{headers:{Accept:"application/json"}});
    ok = r.ok && (r.headers.get("content-type")||"").includes("json");
  }catch(e){ ok=false; }
  if(!ok){ $("guestWait").hidden=false; $("waline").style.display="none"; return; }
  $("guestWait").hidden=true; $("waline").style.display="";
  const mod=await import("https://unpkg.com/@waline/client@v3/dist/waline.js");
  const css=document.createElement("link"); css.rel="stylesheet";
  css.href="https://unpkg.com/@waline/client@v3/dist/waline.css"; document.head.appendChild(css);
  mod.init({ el:"#waline", serverURL:GUEST_SERVER, path:"/", lang:"zh-TW",
    login:"disable", reaction:false, emoji:false, dark:true,
    locale:{ placeholder:"寫下你的留言或推薦…（暱稱必填，Email 可留可不留）" } });
  walineLoaded=true;
}
function openGuest(){ guest.classList.add("is-on"); $("guestClose").hidden=false; initWaline(); }
function closeGuest(){ guest.classList.remove("is-on"); $("guestClose").hidden=true; }
$("guestLink").addEventListener("click",e=>{e.preventDefault();openGuest();});
$("guestClose").addEventListener("click",closeGuest);

addEventListener("resize",sizeCanvas); sizeCanvas();
</script>
